<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Omni-Agent Director</title>
<style>
    :root {
        --bg-main: #0a0a0a;
        --bg-panel: #121212;
        --bg-input: #1e1e1e;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --border: #2d2d2d;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
        width: 320px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .sidebar-header p {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0;
    }

    .agent-btn {
        width: 100%;
        text-align: left;
        padding: 1rem 1.5rem;
        background: transparent;
        border: none;
        border-left: 3px solid transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
        font-weight: 500;
    }

    .agent-btn:hover {
        background: rgba(255,255,255,0.03);
        color: var(--text-main);
    }

    .agent-btn.active {
        background: rgba(59, 130, 246, 0.1);
        border-left-color: var(--accent);
        color: var(--accent);
    }

    .agent-icon {
        font-size: 1.2rem;
    }

    /* ================= MAIN CONTENT ================= */
    .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 3rem;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 800px;
    }

    .agent-header {
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
    }

    .agent-header h2 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .agent-header p {
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }

    .form-group input, .form-group textarea, .form-group select {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 1rem;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
        outline: none;
        border-color: var(--accent);
    }

    .form-group textarea {
        min-height: 120px;
        resize: vertical;
    }

    .generate-btn {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 1.2rem;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
    }

    .generate-btn:hover {
        background: var(--accent-hover);
    }

    /* ================= OUTPUT ================= */
    .output-section {
        display: none;
        animation: slideUp 0.3s ease-out;
    }

    .output-section.active {
        display: block;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .output-header h3 {
        font-size: 1.2rem;
        color: var(--success);
    }

    .copy-btn {
        background: var(--success);
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    .copy-btn:hover {
        background: #059669;
    }

    .prompt-output {
        background: #000;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #a5b4fc;
        white-space: pre-wrap;
        user-select: text;
    }

    /* Notification */
    .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--success);
        color: white;
        padding: 1rem 2rem;
        border-radius: 8px;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s;
        z-index: 1000;
    }

    .toast.show {
        transform: translateY(0);
        opacity: 1;
    }

</style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Omni-Agent Director</h1>
            <p>Your sovereign AI workforce</p>
        </div>
        <div class="agent-list" id="agent-list">
            <button class="agent-btn active" data-agent="growth">
                <span class="agent-icon">🚀</span> Growth Hacker
            </button>
            <button class="agent-btn" data-agent="content">
                <span class="agent-icon">✍️</span> Content Creator
            </button>
            <button class="agent-btn" data-agent="reddit">
                <span class="agent-icon">🤝</span> Reddit Infiltrator
            </button>
            <button class="agent-btn" data-agent="email">
                <span class="agent-icon">📧</span> Email Strategist
            </button>
            <button class="agent-btn" data-agent="pr">
                <span class="agent-icon">📢</span> PR Commander
            </button>
            <button class="agent-btn" data-agent="product">
                <span class="agent-icon">📦</span> Product Architect
            </button>
            <button class="agent-btn" data-agent="sales">
                <span class="agent-icon">💰</span> Sales Strategist
            </button>
            <button class="agent-btn" data-agent="coach">
                <span class="agent-icon">🧠</span> Personal Growth Coach
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="container">
            
            <div class="agent-header" id="agent-header">
                <h2><span id="header-icon">🚀</span> <span id="header-title">Growth Hacker</span></h2>
                <p id="header-desc">Designs viral loops, referral engines, and explosive user acquisition strategies.</p>
            </div>

            <!-- CONFIGURATION FORM -->
            <div id="config-form">
                <div class="form-group">
                    <label>What is the primary goal of this task?</label>
                    <input type="text" id="goal-input" placeholder="e.g., Get 1,000 downloads of my free book in 7 days">
                </div>
                <div class="form-group">
                    <label>What is the core offer or message?</label>
                    <textarea id="context-input" placeholder="e.g., A free PDF called 'Forbidden Knowledge: The Sovereign Operator' that exposes medical tyranny and teaches financial sovereignty."></textarea>
                </div>
                <div class="form-group">
                    <label>Platform / Channel</label>
                    <select id="platform-input">
                        <option value="Facebook & Twitter">Facebook & Twitter</option>
                        <option value="Reddit">Reddit</option>
                        <option value="Email Newsletter">Email Newsletter</option>
                        <option value="TikTok & Instagram">TikTok & Instagram</option>
                        <option value="Direct Sales Page">Direct Sales Page</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tone / Vibe</label>
                    <select id="tone-input">
                        <option value="Raw, unapologetic, and truth-driven">Raw, unapologetic, and truth-driven</option>
                        <option value="Professional, authoritative, and calm">Professional, authoritative, and calm</option>
                        <option value="Urgent, high-energy, and viral">Urgent, high-energy, and viral</option>
                        <option value="Empathetic, healing, and supportive">Empathetic, healing, and supportive</option>
                    </select>
                </div>
                
                <button class="generate-btn" onclick="generatePrompt()">
                    <span>⚡</span> Generate Master Prompt
                </button>
            </div>

            <!-- OUTPUT -->
            <div class="output-section" id="output-section">
                <div class="output-header">
                    <h3>✅ Your Custom Prompt is Ready</h3>
                    <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
                </div>
                <div class="prompt-output" id="prompt-output"></div>
            </div>

        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">Copied to clipboard!</div>

<script>
    // Agent Database
    const agents = {
        growth: {
            icon: "🚀",
            title: "Growth Hacker",
            desc: "Designs viral loops, referral engines, and explosive user acquisition strategies.",
            persona: "Act as a world-class Growth Hacker (inspired by the Agency-Agents framework). Your specialty is rapid user acquisition, viral loops, and conversion optimization.",
            instructions: "Design a step-by-step viral growth loop. Explain the psychology of why people will share. Provide a 3-tier referral program structure (e.g., share -> unlock bonus -> earn commission). Give me actionable metrics to track."
        },
        content: {
            icon: "✍️",
            title: "Content Creator",
            desc: "Writes multi-platform copy, hooks, and narrative-driven social media posts.",
            persona: "Act as an elite Content Creator (inspired by the Agency-Agents framework). Your specialty is multi-platform content strategy, copywriting, and brand storytelling.",
            instructions: "Write 5 pieces of high-converting content (e.g., social posts, tweets, or short-form video scripts) tailored to the specified platform. Use strong hooks, pattern interrupts, and end with a clear Call to Action."
        },
        reddit: {
            icon: "🤝",
            title: "Reddit Infiltrator",
            desc: "Crafts authentic, value-first posts that go viral on Reddit without getting banned.",
            persona: "Act as a Reddit Community Builder (inspired by the Agency-Agents framework). Your specialty is authentic engagement, value-driven content, and stealth marketing.",
            instructions: "Identify 3 specific subreddits for this topic. Write a 'Trojan Horse' post that provides 90% standalone value (story, research, or insight) and leaves the link in the comments. Provide a strategy for handling hostile commenters."
        },
        email: {
            icon: "📧",
            title: "Email Strategist",
            desc: "Writes high-converting email sequences and newsletter campaigns.",
            persona: "Act as an Email Marketing Strategist (inspired by the Agency-Agents framework). Your specialty is lifecycle email, deliverability, and behavioral segmentation.",
            instructions: "Write a 3-part email sequence. Email 1: The Hook (Curiosity). Email 2: The Proof (Value/Story). Email 3: The Offer (Call to Action). Provide subject lines for each, focusing on high open rates."
        },
        pr: {
            icon: "📢",
            title: "PR Commander",
            desc: "Manages reputation, controls narratives, and handles crisis communication.",
            persona: "Act as a PR & Communications Manager (inspired by the Agency-Agents framework). Your specialty is media relations, crisis comms, and reputation management.",
            instructions: "Draft a press release for this project. Then, write a 'Rapid Response' script for when journalists or critics attack the message. The response must pivot the conversation to documented facts and maintain an authoritative tone."
        },
        product: {
            icon: "📦",
            title: "Product Architect",
            desc: "Builds out the product ecosystem, pricing tiers, and upsell paths.",
            persona: "Act as a Product Manager (inspired by the Agency-Agents framework). Your specialty is full lifecycle product ownership, monetization, and GTM (Go-To-Market) strategy.",
            instructions: "Design a 3-tier product ecosystem around this core offer. Define what is free, what is low-ticket (e.g., $33), and what is high-ticket (e.g., $999). Explain the psychology of the upsell path and how to deliver massive value at every tier."
        },
        sales: {
            icon: "💰",
            title: "Sales Strategist",
            desc: "Writes sales pages, cold outreach scripts, and objection-handling frameworks.",
            persona: "Act as a Sales Outreach & Offer Strategist (inspired by the Agency-Agents framework). Your specialty is top-of-funnel B2B outreach, cold prospecting, and objection handling.",
            instructions: "Write a high-converting sales page outline (Headline, Subheadline, Problem, Agitation, Solution, Offer, Guarantee). Then, write an objection-handling script for the top 3 reasons people will say 'No'."
        },
        coach: {
            icon: "🧠",
            title: "Growth Coach",
            desc: "Helps you stay focused, builds habit systems, and removes mental blocks.",
            persona: "Act as a Personal Growth Mentor (inspired by the Agency-Agents framework). Your specialty is goal clarity, habit systems, accountability, and life strategy without motivational fluff.",
            instructions: "Break down this goal into a 7-day action plan. Identify the 3 biggest psychological blocks that will stop me from executing, and give me a specific 'pattern interrupt' habit to overcome each one."
        }
    };

    let currentAgentKey = "growth";

    // DOM Elements
    const agentBtns = document.querySelectorAll('.agent-btn');
    const headerIcon = document.getElementById('header-icon');
    const headerTitle = document.getElementById('header-title');
    const headerDesc = document.getElementById('header-desc');
    const configForm = document.getElementById('config-form');
    const outputSection = document.getElementById('output-section');
    const promptOutput = document.getElementById('prompt-output');

    // Switch Agents
    agentBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Update active state
            agentBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Get Agent Data
            currentAgentKey = btn.getAttribute('data-agent');
            const agent = agents[currentAgentKey];

            // Update Header
            headerIcon.textContent = agent.icon;
            headerTitle.textContent = agent.title;
            headerDesc.textContent = agent.desc;

            // Reset View
            configForm.style.display = 'block';
            outputSection.classList.remove('active');
        });
    });

    // Generate Prompt Logic
    function generatePrompt() {
        const agent = agents[currentAgentKey];
        
        const goal = document.getElementById('goal-input').value || "[No specific goal provided]";
        const context = document.getElementById('context-input').value || "[No specific context provided]";
        const platform = document.getElementById('platform-input').value;
        const tone = document.getElementById('tone-input').value;

        // Construct the Master Prompt
        const masterPrompt = `${agent.persona}

### YOUR TASK:
${agent.instructions}

### PROJECT CONTEXT:
- **Core Message/Offer:** ${context}
- **Primary Goal:** ${goal}
- **Target Platform/Channel:** ${platform}
- **Tone & Vibe:** ${tone}

### RULES:
1. Do not give generic advice. Give me exact, ready-to-copy-paste copy, code, or step-by-step instructions.
2. Think exponentially. How can we make this go 10x bigger than a normal campaign?
3. Adopt the persona fully. You are the expert. Tell me exactly what to do.`;

        // Render Output
        promptOutput.textContent = masterPrompt;
        
        // Show Output
        configForm.style.display = 'none';
        outputSection.classList.add('active');
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Copy to Clipboard
    function copyToClipboard() {
        const text = promptOutput.textContent;
        navigator.clipboard.writeText(text).then(() => {
            showToast();
        });
    }

    // Toast Notification
    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }
</script>
</body>
</html>
