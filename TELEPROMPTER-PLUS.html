<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Teleprompter · TripsToColombia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1c26;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: #f0f7fc;
    }
    .app-container {
      max-width: 860px;
      width: 100%;
      background: #152b36;
      border-radius: 3rem;
      padding: 1.5rem 1.2rem 1.8rem;
      box-shadow: 0 25px 50px -10px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.06);
      border: 1px solid #2b4d5c;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 0.8rem;
      margin-bottom: 1rem;
      padding: 0 0.25rem;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #b3e4f0, #7fc1d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .header h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      background: #1f4050;
      padding: 0.15rem 0.9rem;
      border-radius: 40px;
      color: #cbe3ed;
      -webkit-text-fill-color: #cbe3ed;
      letter-spacing: 0.2px;
    }
    .badge-trips {
      background: #1f4d5e;
      color: #d4ecf5;
      font-weight: 500;
      font-size: 0.8rem;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0,20,30,0.4);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* Teleprompter display */
    .teleprompter {
      background: #0b1b24;
      border-radius: 2.5rem;
      padding: 2rem 1.5rem;
      min-height: 240px;
      max-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2d5568;
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.6);
      margin-bottom: 1rem;
      position: relative;
    }
    .teleprompter-text {
      font-size: 3.2rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      word-break: break-word;
      letter-spacing: -0.01em;
      color: #f0faff;
      text-shadow: 0 2px 8px rgba(0,20,30,0.6);
      max-height: 340px;
      overflow-y: auto;
      scroll-behavior: smooth;
      width: 100%;
      padding: 0.2rem;
    }
    @media (max-width: 500px) {
      .teleprompter-text { font-size: 2.2rem; }
      .teleprompter { min-height: 180px; padding: 1.2rem 0.8rem; }
    }
    .word-highlight {
      background: #3f8ba0;
      color: #ffffff;
      padding: 0.1rem 0.3rem;
      border-radius: 12px;
      box-shadow: 0 0 0 1px #6ab3cc;
    }

    /* Control panel */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.6rem 0.8rem;
      background: #1c3a48;
      padding: 0.7rem 1rem;
      border-radius: 4rem;
      margin-bottom: 1rem;
      border: 1px solid #325a6b;
    }
    .btn {
      background: #264f60;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #eaf3f8;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px solid #3f7488;
      flex: 0 1 auto;
    }
    .btn-primary {
      background: #2d7a92;
      border-color: #4f9bb3;
      color: white;
      box-shadow: 0 6px 12px rgba(0,40,60,0.4);
    }
    .btn-primary:active { transform: scale(0.96); }
    .btn-secondary { background: #1d4353; border-color: #2f6377; }
    .btn-secondary:active { transform: scale(0.96); }
    .btn-danger { background: #8f3d3d; border-color: #b35151; }
    .btn-danger:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.4); }
    .slide-controls { display: flex; gap: 0.4rem; margin-left: auto; }
    .slide-btn {
      background: #1e4050;
      border: 1px solid #3b6f82;
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 1.4rem;
      font-weight: 300;
      color: #d6ecf5;
      cursor: pointer;
      line-height: 1.2;
      user-select: none;
      transition: 0.08s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .slide-btn:active { background: #356f84; transform: scale(0.92); }
    .word-counter {
      font-size: 0.85rem;
      background: #0b212b;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: #b3dae7;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Text editor / import */
    .editor-section {
      background: #0d202b;
      border-radius: 2rem;
      padding: 0.8rem 0.8rem 0.6rem;
      border: 1px solid #2f5a6b;
      margin-top: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      margin-bottom: 0.5rem;
      padding: 0 0.2rem;
    }
    .editor-header label {
      font-weight: 500;
      color: #b0d2df;
      font-size: 0.9rem;
    }
    .editor-actions {
      display: flex;
      gap: 0.4rem;
    }
    .editor-actions .btn {
      padding: 0.2rem 1rem;
      font-size: 0.75rem;
    }
    .editor-textarea {
      width: 100%;
      background: #0b1b24;
      border: 1px solid #2a5568;
      border-radius: 1.5rem;
      padding: 0.8rem 1.2rem;
      color: #e0f0f7;
      font-size: 0.95rem;
      font-family: 'Inter', monospace;
      resize: vertical;
      min-height: 80px;
      max-height: 200px;
      line-height: 1.5;
      transition: border 0.15s;
    }
    .editor-textarea:focus {
      outline: none;
      border-color: #5f9bb3;
      box-shadow: 0 0 0 2px rgba(60, 140, 170, 0.3);
    }
    .editor-textarea::placeholder { color: #4d7a8c; }

    /* Video section */
    .video-section {
      margin-top: 0.8rem;
      background: #0d202b;
      border-radius: 2rem;
      padding: 0.6rem;
      border: 1px solid #2f5a6b;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-wrapper {
      width: 100%;
      border-radius: 1.8rem;
      overflow: hidden;
      background: #051016;
      position: relative;
      aspect-ratio: 16/9;
      max-height: 200px;
    }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a1922;
    }
    .video-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.4rem 0.8rem;
      padding: 0.5rem 0.2rem 0.1rem;
    }
    .video-btn {
      background: #1a3b49;
      border: 1px solid #3c6f82;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      color: #ddf0f7;
      font-weight: 500;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .video-btn:active { transform: scale(0.94); }
    .video-btn.recording {
      background: #b13e3e;
      border-color: #d66a6a;
      animation: pulse-red 1.2s infinite;
    }
    @keyframes pulse-red {
      0% { opacity: 0.8; }
      50% { opacity: 1; background: #c54a4a; }
      100% { opacity: 0.8; }
    }

    .footer {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      color: #548396;
      text-align: right;
      padding-right: 0.3rem;
      letter-spacing: 0.2px;
    }
    .footer span {
      background: #1b3846;
      padding: 0.1rem 1rem;
      border-radius: 40px;
    }
    .word-count-badge {
      background: #1a3f4e;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #b3dae7;
    }
  </style>
</head>
<body>
<div class="app-container" role="main">
  <div class="header">
    <h1>
      📜 Teleprompter
      <small>voice</small>
    </h1>
    <span class="badge-trips">✈️ TripsToColombia.com</span>
  </div>

  <!-- Teleprompter display -->
  <div class="teleprompter" id="teleprompterDisplay">
    <div class="teleprompter-text" id="prompterText">
      <span style="color:#7ba9be;">📝 Paste your script below &amp; click Start</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="control-panel">
    <button class="btn btn-primary" id="startBtn">▶ Start</button>
    <button class="btn btn-secondary" id="resetBtn">⟲ Reset</button>
    <div class="slide-controls">
      <button class="slide-btn" id="slideUpBtn" aria-label="slide up (previous)">⤴</button>
      <button class="slide-btn" id="slideDownBtn" aria-label="slide down (next)">⤵</button>
    </div>
    <span class="word-counter" id="wordCounter">0 / 0</span>
  </div>

  <!-- Editor / Import -->
  <div class="editor-section">
    <div class="editor-header">
      <label for="scriptEditor">✏️ Custom Script (paste any text)</label>
      <div class="editor-actions">
        <button class="btn btn-secondary" id="applyScriptBtn" style="padding:0.2rem 1.2rem;">📥 Apply</button>
        <button class="btn btn-secondary" id="resetScriptBtn" style="padding:0.2rem 1.2rem;">↺ Default</button>
      </div>
    </div>
    <textarea id="scriptEditor" class="editor-textarea" placeholder="Paste your script here. Each line or sentence will become a prompter step.&#10;Example:&#10;Welcome to TripsToColombia.com&#10;Your journey starts here.&#10;Explore vibrant cities..."></textarea>
    <div style="display:flex; justify-content:flex-end; margin-top:0.3rem; padding-right:0.3rem;">
      <span class="word-count-badge" id="wordCountBadge">0 words</span>
    </div>
  </div>

  <!-- Video recorder -->
  <div class="video-section">
    <div class="video-wrapper">
      <video id="videoPreview" autoplay muted playsinline></video>
    </div>
    <div class="video-controls">
      <button class="video-btn" id="videoToggleBtn">🎥 Start Camera</button>
      <button class="video-btn" id="recordBtn" disabled>⏺ Record</button>
      <button class="video-btn" id="downloadBtn" disabled>⬇ Download</button>
    </div>
  </div>
  <div class="footer"><span>👆 slide controls · manual override · large text</span></div>
</div>

<script>
  (function() {
    "use strict";

    // ----- DOM refs -----
    const prompterText = document.getElementById('prompterText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const slideUpBtn = document.getElementById('slideUpBtn');
    const slideDownBtn = document.getElementById('slideDownBtn');
    const wordCounter = document.getElementById('wordCounter');
    const scriptEditor = document.getElementById('scriptEditor');
    const applyScriptBtn = document.getElementById('applyScriptBtn');
    const resetScriptBtn = document.getElementById('resetScriptBtn');
    const wordCountBadge = document.getElementById('wordCountBadge');

    // video
    const videoPreview = document.getElementById('videoPreview');
    const videoToggleBtn = document.getElementById('videoToggleBtn');
    const recordBtn = document.getElementById('recordBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // ----- DEFAULT SCRIPT (fallback) -----
    const DEFAULT_SCRIPT = [
      "Welcome to TripsToColombia.com",
      "Your journey starts here.",
      "Explore vibrant cities,",
      "breathtaking landscapes,",
      "and the warmth of Colombian culture.",
      "From the Andes to the Caribbean,",
      "every moment is an adventure.",
      "Let this voice prompter guide you.",
      "Speak clearly and the words will follow.",
      "Thank you for choosing us."
    ];

    // ----- state -----
    let scriptWords = [];                // array of strings (each step)
    let currentWordIndex = 0;
    let isActive = false;
    let recognition = null;
    let manualOverride = false;
    let expectedWord = '';

    // video state
    let cameraStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isCameraOn = false;

    // ----- helpers -----
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function normalize(str) {
      return str.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function matchSpoken(spoken, expected) {
      if (!spoken || !expected) return false;
      const normSpoken = normalize(spoken);
      const normExpected = normalize(expected);
      if (normSpoken === normExpected) return true;
      // allow partial: if one contains the other and both are long enough
      if (normSpoken.length >= 2 && normExpected.length >= 2) {
        if (normSpoken.includes(normExpected) || normExpected.includes(normSpoken)) return true;
      }
      return false;
    }

    // ----- render prompter -----
    function renderPrompter() {
      if (!scriptWords.length) {
        prompterText.innerHTML = `<span style="color:#7ba9be;">📄 No script. Paste text &amp; Apply.</span>`;
        wordCounter.textContent = `0 / 0`;
        wordCountBadge.textContent = '0 words';
        return;
      }
      // clamp
      if (currentWordIndex >= scriptWords.length) currentWordIndex = scriptWords.length - 1;
      if (currentWordIndex < 0) currentWordIndex = 0;

      const currentWord = scriptWords[currentWordIndex];
      let html = '';
      scriptWords.forEach((word, idx) => {
        if (idx === currentWordIndex) {
          html += `<span class="word-highlight">${escapeHtml(word)}</span>`;
        } else {
          html += escapeHtml(word);
        }
        if (idx < scriptWords.length - 1) html += ' ';
      });
      prompterText.innerHTML = html;
      wordCounter.textContent = `${currentWordIndex + 1} / ${scriptWords.length}`;
      wordCountBadge.textContent = `${scriptWords.length} words`;

      // scroll highlight into view
      const highlight = prompterText.querySelector('.word-highlight');
      if (highlight) {
        highlight.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    // ----- load script from textarea -----
    function loadScriptFromEditor() {
      const raw = scriptEditor.value;
      // split by newline, trim, filter empty
      let lines = raw.split(/\n/).map(s => s.trim()).filter(s => s.length > 0);
      if (lines.length === 0) {
        // if nothing, fallback to default
        lines = DEFAULT_SCRIPT.slice();
        scriptEditor.value = DEFAULT_SCRIPT.join('\n');
      }
      scriptWords = lines;
      currentWordIndex = 0;
      renderPrompter();
      // if currently active, restart recognition to reset matching
      if (isActive) {
        // restart listening
        stopListening();
        setTimeout(() => startListening(), 200);
      }
    }

    // ----- reset to default -----
    function resetToDefault() {
      scriptEditor.value = DEFAULT_SCRIPT.join('\n');
      loadScriptFromEditor();
    }

    // ----- advance / retreat -----
    function advanceWord() {
      if (currentWordIndex < scriptWords.length - 1) {
        currentWordIndex++;
        renderPrompter();
        return true;
      }
      return false;
    }

    function retreatWord() {
      if (currentWordIndex > 0) {
        currentWordIndex--;
        renderPrompter();
        return true;
      }
      return false;
    }

    function resetPrompter() {
      currentWordIndex = 0;
      renderPrompter();
    }

    // ----- Speech recognition -----
    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Speech recognition not supported in this browser.');
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';
      rec.maxAlternatives = 1;

      rec.onresult = (event) => {
        if (!isActive) return;
        if (manualOverride) return;
        if (!scriptWords.length) return;

        let spoken = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            const transcript = result[0]?.transcript?.trim() || '';
            if (transcript) { spoken = transcript; break; }
          } else if (!spoken) {
            spoken = result[0]?.transcript?.trim() || '';
          }
        }
        if (!spoken) return;

        const expected = scriptWords[currentWordIndex] || '';
        if (matchSpoken(spoken, expected)) {
          const moved = advanceWord();
          if (moved) {
            manualOverride = true;
            setTimeout(() => { manualOverride = false; }, 400);
          }
        }
      };

      rec.onerror = (event) => {
        console.warn('Speech error:', event.error);
        if (event.error === 'not-allowed') {
          alert('Microphone access denied.');
          stopListening();
        }
        if (isActive && recognition) {
          setTimeout(() => {
            if (isActive && recognition) {
              try { recognition.start(); } catch (_) {}
            }
          }, 300);
        }
      };

      rec.onend = () => {
        if (isActive) {
          try { if (recognition) recognition.start(); } catch (_) {}
        }
      };

      return rec;
    }

    function startListening() {
      if (isActive) {
        stopListening();
        return;
      }
      if (!scriptWords.length) {
        alert('Please paste a script and click Apply.');
        return;
      }
      if (!recognition) {
        recognition = initRecognition();
        if (!recognition) return;
      }
      try {
        recognition.start();
        isActive = true;
        startBtn.textContent = '⏹ Stop';
        startBtn.classList.add('btn-danger');
        startBtn.classList.remove('btn-primary');
        renderPrompter();
      } catch (e) {
        console.warn('start error:', e);
        setTimeout(() => {
          if (!isActive) {
            try { recognition.start(); isActive = true; startBtn.textContent = '⏹ Stop'; } catch (_) {}
          }
        }, 300);
      }
    }

    function stopListening() {
      isActive = false;
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }
      startBtn.textContent = '▶ Start';
      startBtn.classList.remove('btn-danger');
      startBtn.classList.add('btn-primary');
      renderPrompter();
    }

    // ----- manual slide (with override) -----
    function manualSlideUp() {
      if (!isActive) { retreatWord(); return; }
      manualOverride = true;
      retreatWord();
      setTimeout(() => { manualOverride = false; }, 300);
    }

    function manualSlideDown() {
      if (!isActive) { advanceWord(); return; }
      manualOverride = true;
      advanceWord();
      setTimeout(() => { manualOverride = false; }, 300);
    }

    // ----- VIDEO -----
    async function toggleCamera() {
      if (isCameraOn) {
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        videoPreview.srcObject = null;
        isCameraOn = false;
        videoToggleBtn.textContent = '🎥 Start Camera';
        recordBtn.disabled = true;
        downloadBtn.disabled = true;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        cameraStream = stream;
        videoPreview.srcObject = stream;
        isCameraOn = true;
        videoToggleBtn.textContent = '📷 Stop Camera';
        recordBtn.disabled = false;
        downloadBtn.disabled = true;
        recordedChunks = [];
      } catch (e) {
        alert('Camera/microphone access denied: ' + e.message);
      }
    }

    function toggleRecording() {
      if (!isCameraOn || !cameraStream) { alert('Please start camera first.'); return; }
      if (isRecording) {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = '⏺ Record';
        recordBtn.classList.remove('recording');
        downloadBtn.disabled = false;
        return;
      }
      if (!MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        alert('Video recording not supported in this browser.');
        return;
      }
      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9' };
      try {
        mediaRecorder = new MediaRecorder(cameraStream, options);
      } catch (e) {
        alert('Could not start recording: ' + e.message);
        return;
      }
      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) recordedChunks.push(event.data);
      };
      mediaRecorder.onstop = () => {
        if (recordedChunks.length) {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          downloadBtn.dataset.url = url;
          downloadBtn.disabled = false;
        } else {
          downloadBtn.disabled = true;
        }
        isRecording = false;
        recordBtn.textContent = '⏺ Record';
        recordBtn.classList.remove('recording');
      };
      mediaRecorder.start(200);
      isRecording = true;
      recordBtn.textContent = '⏹ Stop';
      recordBtn.classList.add('recording');
      downloadBtn.disabled = true;
    }

    function downloadVideo() {
      const url = downloadBtn.dataset.url;
      if (!url) return;
      const a = document.createElement('a');
      a.href = url;
      a.download = `prompter-recording-${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ----- event listeners -----
    startBtn.addEventListener('click', startListening);
    resetBtn.addEventListener('click', resetPrompter);
    slideUpBtn.addEventListener('click', manualSlideUp);
    slideDownBtn.addEventListener('click', manualSlideDown);
    applyScriptBtn.addEventListener('click', loadScriptFromEditor);
    resetScriptBtn.addEventListener('click', resetToDefault);

    videoToggleBtn.addEventListener('click', toggleCamera);
    recordBtn.addEventListener('click', toggleRecording);
    downloadBtn.addEventListener('click', downloadVideo);

    // ----- init -----
    // populate default script
    scriptEditor.value = DEFAULT_SCRIPT.join('\n');
    loadScriptFromEditor();

    // warm up speech
    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
      recognition = initRecognition();
    } else {
      startBtn.disabled = true;
      startBtn.textContent = '⚠️ No Speech';
    }

    // clean up
    window.addEventListener('beforeunload', () => {
      if (recognition) try { recognition.abort(); } catch (_) {}
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    });

  })();
</script>
</body>
</html>
