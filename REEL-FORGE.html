        .subtitle {

        .input-section {

        .input-wrapper {

        .input-wrapper label {

            margin-left: 8px;
        }
        .input-wrapper input {
            background: #1a1a24;

            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2), 0 8px 20px rgba(0, 0, 0, 0.6);
        }
        .generate-btn {
            flex: 0.8;
            min-width: 180px;
            background: linear-gradient(135deg, #ff3b3b, #ff7a2f);
            border: none;
            border-radius: 60px;
            padding: 0 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;

            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px -5px #ff3b3b;
            background: linear-gradient(135deg, #ff5a5a, #ff8f4a);
        }
        .generate-btn:active {
            transform: translateY(2px);
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding: 0 0.5rem;
            color: #b0b0d0;
            font-size: 0.95rem;
        }
        .stats-bar span {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .reels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
            margin-top: 1rem;
            scrollbar-width: thin;
            scrollbar-color: #ff6b6b #1e1e2a;
        }
        .reels-grid::-webkit-scrollbar {
            width: 8px;
        }
        .reels-grid::-webkit-scrollbar-track {
            background: #1e1e2a;
            border-radius: 10px;
        }
        .reels-grid::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }
        .reel-card {
            background: #16161f;
            border-radius: 1.5rem;
            padding: 1.2rem 1.2rem 1rem;
            border: 1px solid #2a2a3a;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .reel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #ffb347, #ff6b6b);
        }
        .reel-card:hover {
            border-color: #ff6b6b;
            box-shadow: 0 15px 30px -8px rgba(255, 70, 70, 0.3);
            transform: scale(1.01);
        }
        .reel-number {
            font-size: 0.7rem;
            font-weight: 800;
            color: #ff6b6b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
        }
        .reel-phrase {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
            color: #f0f0ff;
            margin-bottom: 0.8rem;
            flex: 1;
            word-break: break-word;
        }
        .reel-meta {
            font-size: 0.7rem;
            color: #80809a;
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid #2a2a3a;
            padding-top: 0.7rem;
            margin-top: 0.3rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            background: rgba(255, 107, 107, 0.15);
            color: #ff9f9f;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: #5a5a72;
            font-size: 1.2rem;
            font-weight: 400;
            border: 2px dashed #2a2a3a;
            border-radius: 2rem;
        }
        .empty-state span {
            display: block;
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .copy-btn {
            background: #1e1e2a;
            border: 1px solid #3a3a4e;
            color: #ccc;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-btn:hover {
            background: #2a2a3a;
            color: white;
            border-color: #ff6b6b;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3b3b;
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 15px 30px rgba(255, 60, 60, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
            letter-spacing: 0.3px;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>⚡ REEL FORGE</h1>
        <div class="subtitle">One phrase → 100 viral reel scripts, instantly. Exponentially better than anything out there.</div>

        <div class="input-section">
            <div class="input-wrapper">
                <label>YOUR CORE PHRASE / OFFER / HOOK</label>
                <input type="text" id="corePhrase" placeholder="e.g. 'AI side hustle', 'fat loss blueprint', 'notion template'" value="AI side hustle">
            </div>
            <button class="generate-btn" id="generateBtn">
                <span>🚀</span> Forge 100 reels
            </button>
        </div>

        <div class="stats-bar">
            <span id="campaignStats">⚡ Ready to dominate</span>
            <span id="copyStats">📋 0 reels</span>
        </div>

        <div class="reels-grid" id="reelsGrid">
            <div class="empty-state">
                <span>🎬</span>
                Enter your core phrase and hit <strong>FORGE 100 REELS</strong>.<br>
                The entire campaign will appear here.
            </div>
        </div>

        <div class="action-bar">
            <button class="copy-btn" id="copyAllBtn">

    </div>

    <div class="toast" id="toast">✅ Campaign copied to clipboard</div>

    <script>
        (function() {
            // ---------- 🔥 REEL FORGE ENGINE ----------
            // 100+ unique, high-converting reel phrase templates.
            // Each template combines the core phrase with psychological triggers,
            // urgency, curiosity, transformation, and social proof.
            // Exponentially better than generic generators.

            const TEMPLATES = [
                // CURIOSITY / SECRET

                // TRANSFORMATION / BEFORE-AFTER
                "From zero to {core} hero in 30 days (my journey)",
                "How I turned {core} into a full-time income",
                "This {core} routine changed my life forever",
                "The {core} glow-up: my 6-month transformation",

                "Why {core} is the best decision I ever made",

                "My {core} results will blow your mind",

                // URGENCY / FOMO
                "You're running out of time to start {core}",
                "The {core} window is closing — act now",
                "If you ignore {core}, you'll regret it in 2025",

                "Why {core} won't work in 6 months (do it now)",
                "The {core} train is leaving — are you on it?",
                "Don't wait for {core} to become mainstream",
                "This {core} opportunity is disappearing fast",
                "Start {core} before everyone else does",
                "The {core} gold rush is happening right now",

                // SOCIAL PROOF / AUTHORITY
                "Why top creators swear by this {core} method",
                "The {core} strategy 7-figure entrepreneurs use",
                "What nobody tells you about {core} success",
                "I interviewed 50 {core} experts — here's the truth",
                "This {core} advice is worth $10,000 (free)",
                "The {core} framework used by industry leaders",
                "Proof that {core} works (with real numbers)",
                "Why Harvard grads are obsessed with {core}",
                "The {core} rule that millionaires follow",
                "How {core} became the #1 skill in 2025",

                // STEP-BY-STEP / ACTIONABLE
                "The 3-step {core} formula you can copy",
                "How to start {core} in under 10 minutes",
                "My exact {core} checklist (steal this)",
                "The only {core} tutorial you'll ever need",
                "Step-by-step: {core} for absolute beginners",
                "The lazy way to get {core} results",
                "How to master {core} in 30 days or less",
                "The {core} cheat code that actually works",
                "Your first 7 days of {core} (full plan)",
                "The 80/20 of {core} that changes everything",

                // FEAR / PAIN / LOSS AVERSION
                "The {core} mistake that costs you $10k",
                "Why your {core} isn't working (fix it now)",
                "The hidden {core} trap that kills progress",
                "Stop wasting time on {core} — do this instead",
                "The {core} failure nobody warns you about",
                "If {core} isn't working, it's because of this",
                "The {core} mistake that keeps you broke",
                "How to avoid the #1 {core} disaster",
                "The {core} lie that's holding you back",
                "Why 90% of people fail at {core} (and how to win)",

                // COMPARISON / CONTRAST
                "{core} vs. the old way — the difference is insane",
                "Why {core} beats everything else (data proves it)",
                "The {core} method that outperforms 99% of strategies",
                "This {core} approach is 10x better than normal",
                "Stop using outdated {core} tactics",
                "The {core} upgrade that changes the game",
                "Why smart people are switching to {core}",
                "{core} in 2025 vs. {core} in 2020 (huge shift)",
                "The {core} alternative that actually works",
                "Old {core} vs. new {core} — which one wins?",

                // PERSONAL STORY / RELATABILITY
                "How {core} saved me from burnout",
                "My {core} rock bottom (and how I recovered)",
                "The day I discovered {core} changed everything",
                "I was skeptical about {core} — then this happened",
                "The {core} moment that made me go all in",
                "Why I almost quit {core} (and what saved me)",
                "My honest {core} review after 1 year",
                "The {core} lesson that cost me $5k",
                "How {core} helped me find my purpose",
                "The {core} breakthrough I wasn't expecting",

                // FUTURE / TREND
                "{core} is the future — here's why",
                "Why {core} will explode in 2025",
                "The {core} trend you can't afford to miss",
                "How {core} is reshaping the entire industry",
                "The {core} shift is happening faster than you think",
                "Get ahead of the {core} curve right now",
                "This {core} prediction will blow your mind",
                "The next big thing in {core} (revealed)",
                "Why everyone will be doing {core} next year",
                "{core} is the new meta — adapt or fall behind",

                // PSYCHOLOGICAL TRIGGERS / POWER WORDS
                "The {core} advantage you're not using",
                "How to weaponize {core} for massive growth",
                "The {core} multiplier that changes everything",
                "Unlock the hidden potential of {core}",
                "The {core} accelerator: from 0 to 100",
                "Why {core} is the ultimate leverage",
                "The {core} catalyst for rapid success",
                "How to turn {core} into a money printer",
                "The {core} magnet: attract results effortlessly",
                "This {core} insight is a total game-changer",

                // DIRECT / COMMAND
                "Do this {core} today (not tomorrow)",
                "Steal my {core} system right now",
                "Copy this {core} strategy for instant results",
                "Start {core} before you finish this video",
                "Apply this {core} tip immediately",
                "Use this {core} hack to get ahead",
                "Implement {core} in the next 24 hours",
                "Take this {core} action right now",
                "Your {core} journey starts here",
                "This is your sign to start {core}",
            ];

            // Additional prefixes/suffixes for extra variety (adds 20+ more unique twists)
            const PREFIXES = [
                "🔥", "💡", "🚨", "🤯", "💰", "⚡", "📈", "🔑", "🎯", "🧠"
            ];

            // We'll generate exactly 100 reels using a deterministic mix.
            // Guarantees no duplicates and every reel is unique.
            function generateCampaign(corePhrase) {
                const cleanCore = corePhrase.trim() || "this";
                const reels = [];
                const used = new Set();

                // We cycle through templates, adding a unique prefix each time
                // to maximize variation and reach 100 unique results.
                let templateIndex = 0;
                let prefixIndex = 0;
                let attempt = 0;
                const MAX_ATTEMPTS = 5000; // safety

                while (reels.length < 100 && attempt < MAX_ATTEMPTS) {
                    const template = TEMPLATES[templateIndex % TEMPLATES.length];
                    const prefix = PREFIXES[prefixIndex % PREFIXES.length];
                    
                    // Build phrase: either with or without prefix (alternating)
                    // to keep it natural and varied.
                    let phrase;
                    if (reels.length % 3 === 0) {
                        // no prefix
                        phrase = template.replace(/{core}/g, cleanCore);
                    } else if (reels.length % 3 === 1) {
                        // prefix + template
                        phrase = prefix + " " + template.replace(/{core}/g, cleanCore);
                    } else {
                        // template + (power suffix)
                        const suffixes = [" (must watch)", " 🔥", " 💯", " ⚠️", " ✨"];
                        const suffix = suffixes[reels.length % suffixes.length];
                        phrase = template.replace(/{core}/g, cleanCore) + " " + suffix;
                    }

                    // Ensure uniqueness
                    if (!used.has(phrase)) {
                        used.add(phrase);
                        reels.push(phrase);
                    }

                    templateIndex++;
                    prefixIndex++;
                    attempt++;

                    // if we've cycled through all templates and prefixes but still need more,
                    // we reset indices but keep adding variations via suffix/prefix mix.
                    if (templateIndex >= TEMPLATES.length && prefixIndex >= PREFIXES.length) {
                        // loop will continue because of modulo
                    }
                }

                // If somehow we didn't reach 100 (should never happen), fill with generic
                while (reels.length < 100) {
                    reels.push(`🔹 ${cleanCore} insight #${reels.length + 1} (bonus)`);
                }

                return reels.slice(0, 100);
            }

            // DOM elements
            const coreInput = document.getElementById('corePhrase');
            const generateBtn = document.getElementById('generateBtn');
            const reelsGrid = document.getElementById('reelsGrid');
            const campaignStats = document.getElementById('campaignStats');
            const copyStats = document.getElementById('copyStats');
            const copyAllBtn = document.getElementById('copyAllBtn');
            const toast = document.getElementById('toast');

            let currentReels = [];

            // Render reels grid
            function renderReels(reels) {
                if (!reels || reels.length === 0) {
                    reelsGrid.innerHTML = `
                        <div class="empty-state">
                            <span>🎬</span>
                            Enter your core phrase and hit <strong>FORGE 100 REELS</strong>.<br>
                            The entire campaign will appear here.
                        </div>
                    `;
                    return;
                }

                const fragment = document.createDocumentFragment();
                reels.forEach((phrase, idx) => {
                    const card = document.createElement('div');
                    card.className = 'reel-card';
                    // extract a pseudo "hook type" from phrase (just for visual)
                    const hookType = phrase.startsWith('🔥') || phrase.startsWith('💡') ? 'POWER' : 
                                     phrase.includes('secret') || phrase.includes('nobody') ? 'SECRET' : 
                                     phrase.includes('day') || phrase.includes('routine') ? 'ROUTINE' : 'VIRAL';
                    
                    card.innerHTML = `
                        <div class="reel-number">
                            <span>REEL #${idx + 1}</span>
                            <span class="badge">${hookType}</span>
                        </div>
                        <div class="reel-phrase">${escapeHtml(phrase)}</div>
                        <div class="reel-meta">
                            <span>⚡ high retention</span>
                            <span>📈 CTA ready</span>
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                reelsGrid.innerHTML = '';
                reelsGrid.appendChild(fragment);
                campaignStats.textContent = `🔥 ${reels.length} reels forged — ready to dominate`;
                copyStats.textContent = `📋 ${reels.length} reels`;
            }

            // simple escape for HTML (safety)
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Show toast
            function showToast(message) {
                toast.textContent = message || '✅ Campaign copied to clipboard';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }

            // Generate handler
            function handleGenerate() {
                const phrase = coreInput.value.trim();
                if (!phrase) {
                    showToast('⚠️ Please enter a core phrase');
                    return;
                }

                // Generate 100 unique reels
                const reels = generateCampaign(phrase);
                currentReels = reels;
                renderReels(reels);
                
                // Scroll to grid smoothly
                reelsGrid.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                showToast(`✅ 100 reels forged from "${phrase}"`);
            }

            // Copy all reels as text (formatted for social media posting)
            function copyCampaign() {
                if (!currentReels.length) {
                    showToast('⚠️ Generate a campaign first');
                    return;
                }

                const core = coreInput.value.trim() || 'core';
                let text = `🎬 REEL FORGE CAMPAIGN — ${currentReels.length} reels\n`;
                text += `🔹 CORE PHRASE: ${core}\n`;
                text += `🔹 Generated: ${new Date().toLocaleString()}\n`;
                text += `========================================\n\n`;

                currentReels.forEach((reel, i) => {
                    text += `${i + 1}. ${reel}\n`;
                });

                text += `\n========================================\n`;
                text += `⚡ Generated by REEL FORGE — 100 reels ready to publish.`;

                navigator.clipboard.writeText(text).then(() => {
                    showToast(`✅ ${currentReels.length} reels copied! Ready to paste.`);
                }).catch(() => {
                    // fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`✅ ${currentReels.length} reels copied! Ready to paste.`);
                });
            }

            // Event listeners
            generateBtn.addEventListener('click', handleGenerate);
            coreInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
            });
            copyAllBtn.addEventListener('click', copyCampaign);

            // Auto-initialize with example phrase to show magic immediately
            window.addEventListener('load', () => {
                // Small timeout for smoothness
                setTimeout(() => {
                    coreInput.value = 'AI side hustle';
                    handleGenerate();
                }, 150);
            });

            // Also allow clicking on empty state to re-generate (if needed)
            reelsGrid.addEventListener('click', (e) => {
                if (e.target.closest('.empty-state')) {
                    coreInput.focus();
                }
            });

        })();
    </script>
</body>
</html>
