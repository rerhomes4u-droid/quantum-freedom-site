<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantum Freedom — All Apps Hub (Jan 2026)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #080812;
      color: #e0e0ff;
      margin: 0;
      padding: 20px 10px;
      line-height: 1.5;
    }
    header { text-align: center; margin: 2.5rem 0 1.5rem; }
    h1 { color: #b388ff; margin-bottom: 0.4rem; }
    .container { max-width: 1200px; margin: 0 auto; }

    details {
      margin: 1.8rem 0;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    summary {
      padding: 1.2rem 1.6rem;
      background: #1e293b;
      font-size: 1.35rem;
      font-weight: 600;
      color: #c4b5fd;
      cursor: pointer;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.3rem;
      padding: 1.6rem;
    }
    .app-card {
      background: #172033;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.4rem;
      transition: all 0.2s;
    }
    .app-card:hover {
      transform: translateY(-4px);
      border-color: #8b5cf6;
      box-shadow: 0 12px 30px rgba(139,92,246,0.15);
    }
    .app-title {
      color: #d8b4fe;
      font-size: 1.28rem;
      margin: 0 0 0.6rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-title[title] { cursor: help; }
    .desc { color: #cbd5e1; font-size: 0.95rem; margin: 0.4rem 0 0.9rem; }
    .status {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      margin: 0.5rem 0;
      background: #064e3b;
      color: #86efac;
    }
    .warning {
      background: rgba(220,38,38,0.15);
      border-left: 4px solid #ef4444;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 6px;
      font-size: 0.93rem;
    }
    .launch-btn {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 0.75rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.8rem;
    }
    .launch-btn:hover { background: #a78bfa; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Quantum Freedom — Complete App Hub</h1>
    <p style="color:#a1a1ff; opacity:0.9">All root .html apps • Launch directly • Educational & exploratory use only</p>
  </header>

  <!-- Spiritual / Consciousness / Texts -->
  <details open>
    <summary>Spiritual • Consciousness • Sacred Texts</summary>
    <div class="app-grid" id="spiritual"></div>
  </details>

  <!-- Colombia / Travel / Culture / Business -->
  <details open>
    <summary>Colombia • Travel • Culture • Business</summary>
    <div class="app-grid" id="colombia"></div>
  </details>

  <!-- Sovereignty / Legal / Financial -->
  <details>
    <summary>Sovereignty • Legal • Financial Tools</summary>
    <div class="app-grid" id="sovereignty"></div>
  </details>

  <!-- Other / Experiments / Misc -->
  <details>
    <summary>Other • Broadcast • OSINT • Experiments</summary>
    <div class="app-grid" id="misc"></div>
  </details>
</div>

<script>
const BASE = "https://quantum-freedom-site.vercel.app/";

const apps = [
  // Spiritual / Consciousness / Sacred
  {n:"432Hz.html", d:"Healing 432Hz frequency experience", c:"spiritual"},
  {n:"AccessCosmicConsciousness.html", d:"Access to cosmic consciousness", c:"spiritual"},
  {n:"AncientWisdomAwaits.html", d:"Ancient wisdom and teachings", c:"spiritual"},
  {n:"Ayni.html", d:"Ayni - reciprocity principle", c:"spiritual"},
  {n:"BookOfEnoch.html", d:"Book of Enoch text", c:"spiritual"},
  {n:"CatholicSpiritualWarfare-DeliverancePrayers.html", d:"Catholic spiritual warfare prayers", c:"spiritual"},
  {n:"DivineConsciousnessBridge.html", d:"Bridge to divine consciousness", c:"spiritual"},
  {n:"DivinePrinciples.html", d:"Core divine principles", c:"spiritual"},
  {n:"DivineSovereigntyEngine.html", d:"Divine sovereignty activation", c:"spiritual"},
  {n:"GospelOfThomas-TheHiddenSayingsOfJesus.html", d:"Gospel of Thomas hidden sayings", c:"spiritual"},
  {n:"Rosary.html", d:"Rosary prayer guide", c:"spiritual"},
  {n:"TheGospelOfPhilip.html", d:"Gospel of Philip gnostic text", c:"spiritual"},
  {n:"Wisdom-Of-Solomon.html", d:"Wisdom of Solomon scripture", c:"spiritual"},

  // Colombia / Travel / Culture / Business
  {n:"ColombiaAwaitsYourHeart.html", d:"Colombia awaits your heart", c:"colombia"},
  {n:"ColombiaPortal.html", d:"Colombia central portal", c:"colombia"},
  {n:"ColombiaTravelCompanion.html", d:"Colombia travel companion", c:"colombia"},
  {n:"ColombianSoulJourney.html", d:"Colombian soul journey", c:"colombia"},
  {n:"ColombianSoulmate.html", d:"Colombian soulmate finder", c:"colombia"},
  {n:"DiscoverMagicColombia.html", d:"Discover magical Colombia", c:"colombia"},
  {n:"TripsToColombia-theAPP.html", d:"Trips to Colombia main app", c:"colombia"},
  {n:"ColombiaBusinessSuccessBlueprint.html", d:"Colombia business success blueprint", c:"colombia"},
  {n:"ColombianRhythmRevolution.html", d:"Colombian rhythm & music revolution", c:"colombia"},
  {n:"ColombianCulinaryFreedom.html", d:"Colombian culinary freedom", c:"colombia"},

  // Sovereignty / Legal / Financial (with soft warning)
  {n:"Complete_Legal_Liberation-SovereigntyEngine.html", d:"Complete legal liberation system", c:"sovereignty", w:true},
  {n:"DebtNullificationWidget.html", d:"Debt nullification widget", c:"sovereignty", w:true},
  {n:"DestructorDeCasosFederalesColombia.html", d:"Destroyer of federal cases Colombia", c:"sovereignty", w:true},
  {n:"DestructorDeCasosJudicialesColombianos.html", d:"Destroyer of judicial cases Colombia", c:"sovereignty", w:true},
  {n:"QuantumFinancialOS-CompleteDebtEliminationSystem.html", d:"Quantum debt elimination OS", c:"sovereignty", w:true},
  {n:"SovereignMasterPortal-CompleteLiberationSystem.html", d:"Sovereign master portal", c:"sovereignty", w:true},
  {n:"UltimateCourtCaseKiller.html", d:"Ultimate court case killer", c:"sovereignty", w:true},
  {n:"YOUR-DEBT-IS-ALREADY-PAID.html", d:"Your debt is already paid", c:"sovereignty", w:true},
  {n:"TuDeudaYaEstaPagada.html", d:"Tu deuda ya está pagada", c:"sovereignty", w:true},
  {n:"Contract-Killer.html", d:"Contract killer tool", c:"sovereignty", w:true},

  // Misc / Other
  {n:"Broadcast.html", d:"Broadcast system", c:"misc"},
  {n:"Discover.html", d:"Discovery portal", c:"misc"},
  {n:"FK-Portal.html", d:"Forbidden Knowledge portal", c:"misc"},
  {n:"OSINT.html", d:"OSINT intelligence portal", c:"misc"},
  {n:"QuantumFreedomOSv2.0.html", d:"Quantum Freedom OS v2", c:"misc"},
  {n:"TRUTH.html", d:"Truth activation", c:"misc"},
  {n:"FinalCall.html", d:"Final call transmission", c:"misc"},
  {n:"Camino-Libertad.html", d:"Path to freedom", c:"misc"},
  {n:"DesignYourFreedom.html", d:"Design your freedom", c:"misc"},
  {n:"AwakeningJourney.html", d:"Awakening journey", c:"misc"}
  // ... you can keep adding more from the full list below if you want
];

function cleanName(f) {
  let name = f.replace(/\.html$/, '')
              .replace(/-/g, ' ')
              .replace(/_/g, ' ');
  return name.split(' ')
             .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
             .join(' ');
}

function createCard(app) {
  const full = cleanName(app.n);
  const short = full.length > 42 ? full.slice(0,39)+'...' : full;

  const warning = app.w ? `
    <div class="warning">
      <strong>⚠️ Caution:</strong> This app involves legal/financial concepts that may carry risk in real-world use.<br>
      For educational/exploratory purposes only — not legal or financial advice.
    </div>` : "";

  return `
    <div class="app-card">
      <h3 class="app-title" title="${full}">${short}</h3>
      <div class="desc">${app.d || "—"}</div>
      <div class="status">ACTIVE</div>
      ${warning}
      <button class="launch-btn" onclick="window.open('${BASE}${app.n}', '_blank')">Launch →</button>
    </div>
  `;
}

function render() {
  const groups = {
    spiritual:   document.getElementById("spiritual"),
    colombia:    document.getElementById("colombia"),
    sovereignty: document.getElementById("sovereignty"),
    misc:        document.getElementById("misc")
  };

  apps.forEach(app => {
    const target = groups[app.c] || groups.misc;
    target.innerHTML += createCard(app);
  });
}

window.onload = render;
</script>
</body>
</html>
