<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>📖 Forbidden Knowledge 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        background: #1a1e24; display: flex; flex-direction: column;
        height: 100vh; overflow: hidden; transition: background 0.2s;
        user-select: none; -webkit-user-select: none; /* Prevents text highlighting on triple tap */
    }
    body.light { background: #f2f4f8; }

    /* ---------- CLEAN TOOLBAR ---------- */
    .toolbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.6rem 1rem; background: #0d1117; color: #e6edf3;
        border-bottom: 1px solid #30363d; z-index: 10;
    }
    body.light .toolbar { background: #fff; color: #1e293b; border-bottom-color: #cbd5e1; }
    
    .toolbar-title { font-weight: 700; font-size: 1rem; letter-spacing: 0.5px; }
    
    .toolbar-controls { display: flex; gap: 0.4rem; align-items: center; }
    
    .toolbar button {
        background: #21262d; border: 1px solid #3d444d; color: #e6edf3;
        padding: 0.4rem 0.7rem; border-radius: 8px; font-size: 0.8rem;
        cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 0.3rem;
    }
    body.light .toolbar button { background: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
    .toolbar button:hover { background: #30363d; }
    body.light .toolbar button:hover { background: #e2e8f0; }
    
    /* ---------- MAIN LAYOUT ---------- */
    .main-area { flex: 1; display: flex; flex-direction: row; overflow: hidden; }
    
    /* Reader Canvas */
    .reader-container {
        flex: 1; overflow-y: auto; overflow-x: auto; padding: 1.5rem;
        display: flex; flex-direction: column; align-items: center;
        position: relative; background: #1a1e24; transition: background 0.2s;
    }
    body.light .reader-container { background: #f2f4f8; }
    #pdf-canvas {
        display: block; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5);
        border-radius: 4px; background: white; max-width: 100%; height: auto;
    }

    /* ---------- HUGE FLOATING READ BUTTON ---------- */
    .big-play-container {
        position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
        z-index: 20; display: flex; gap: 1rem;
    }
    .big-play-btn {
        background: #238636; color: white; border: none;
        padding: 1.2rem 2.5rem; border-radius: 60px;
        font-size: 1.4rem; font-weight: 800; cursor: pointer;
        box-shadow: 0 10px 25px rgba(35,134,54,0.5);
        display: flex; align-items: center; gap: 0.8rem;
        transition: transform 0.1s, background 0.2s;
    }
    .big-play-btn:hover { background: #2ea043; transform: scale(1.05); }
    .big-play-btn:active { transform: scale(0.95); }
    .big-play-btn.stop-mode { background: #da3633; box-shadow: 0 10px 25px rgba(218,54,51,0.5); }
    
    /* ---------- SIDE TEXT PANEL (for transcription) ---------- */
    .speech-panel {
        width: 300px; background: #0d1117; color: #e6edf3;
        border-left: 1px solid #30363d; display: flex; flex-direction: column;
        transition: transform 0.3s ease;
    }
    body.light .speech-panel { background: #fff; color: #0f172a; border-left-color: #cbd5e1; }
    .speech-panel.hidden { transform: translateX(100%); position: absolute; right: 0; height: 100%; }
    
    .speech-header { padding: 1rem; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    body.light .speech-header { border-bottom-color: #cbd5e1; }
    .speech-header h2 { font-size: 0.9rem; font-weight: 600; opacity: 0.8; }
    
    .spoken-text {
        flex: 1; overflow-y: auto; padding: 1rem;
        font-family: Georgia, serif; font-size: 0.95rem; line-height: 1.6;
    }
    .spoken-text .sentence { display: inline; padding: 2px 0; border-radius: 4px; transition: background 0.2s; }
    .spoken-text .sentence.active { background: #1f6feb; color: white; }

    /* ---------- GAME MODAL ---------- */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    
    .game-menu {
        background: #21262d; border: 1px solid #30363d; border-radius: 16px;
        padding: 2rem; width: 90%; max-width: 400px; text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform: translateY(20px); transition: transform 0.3s;
    }
    .modal-overlay.show .game-menu { transform: translateY(0); }
    
    .game-menu h2 { color: #e6edf3; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .game-menu p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
    
    .game-btn {
        display: block; width: 100%; padding: 1rem; margin-bottom: 0.8rem;
        background: #30363d; color: #e6edf3; border: 1px solid #3d444d;
        border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
        transition: all 0.15s;
    }
    .game-btn:hover { background: #3d444d; transform: scale(1.02); }
    .close-modal { background: #da3633; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 30px; cursor: pointer; margin-top: 1rem; font-weight: bold; }
    
    /* Game Arena */
    .game-arena { display: none; width: 100%; }
    .game-arena.active { display: block; }
    
    /* Game 1: Reaction */
    #reaction-box { width: 100%; height: 200px; border-radius: 12px; background: #da3633; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.1s; }
    #reaction-box.ready { background: #238636; }
    #reaction-text { color: white; font-size: 1.2rem; font-weight: bold; text-align: center; }
    
    /* Game 2: Memory */
    .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
    .memory-card { aspect-ratio: 1; background: #30363d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: background 0.2s; }
    .memory-card.flipped { background: #1f6feb; }
    .memory-card.matched { background: #238636; cursor: default; }
    
    /* Game 3: Word Scramble */
    .scramble-word { font-size: 2rem; font-weight: bold; color: #e6edf3; letter-spacing: 5px; margin-bottom: 1rem; text-transform: uppercase; }
    #scramble-input { width: 100%; padding: 0.8rem; border-radius: 8px; border: none; background: #30363d; color: white; font-size: 1.2rem; text-align: center; margin-bottom: 1rem; outline: none; }
    #scramble-submit { background: #1f6feb; color: white; border: none; padding: 0.8rem; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* ---------- MOBILE RESPONSIVENESS ---------- */
    @media (max-width: 700px) {
        .main-area { flex-direction: column; }
        .speech-panel { width: 100%; height: 200px; border-left: none; border-top: 1px solid #30363d; }
        body.light .speech-panel { border-top-color: #cbd5e1; }
        .big-play-btn { padding: 1rem 2rem; font-size: 1.2rem; }
        .toolbar-title { display: none; }
    }
</style>
</head>
<body>

<!-- CLEAN TOOLBAR -->
<div class="toolbar">
    <div class="toolbar-title">📖 Forbidden Knowledge</div>
    <div class="toolbar-controls">
        <button id="toggle-text-btn">📝 Text</button>
        <button id="theme-toggle">🌗</button>
    </div>
</div>

<div class="main-area">
    <!-- READER -->
    <div class="reader-container" id="reader-container">
        <canvas id="pdf-canvas"></canvas>
        
        <!-- HUGE PLAY BUTTON -->
        <div class="big-play-container">
            <button class="big-play-btn" id="play-btn">▶ Read to Me</button>
        </div>
    </div>

    <!-- TRANSCRIPT PANEL -->
    <aside class="speech-panel hidden" id="speech-panel">
        <div class="speech-header">
            <h2>Live Transcript</h2>
            <button id="close-text-btn" style="background:none;border:none;color:inherit;cursor:pointer;">✕</button>
        </div>
        <div class="spoken-text" id="spoken-text">
            <div style="opacity:0.5; font-style:italic;">Press "Read to Me" to begin.</div>
        </div>
    </aside>
</div>

<!-- GAME MODAL -->
<div class="modal-overlay" id="game-modal">
    <div class="game-menu">
        <div id="menu-view">
            <h2>🎮 Secret Games</h2>
            <p>You found the hidden menu! Pick a quick break.</p>
            <button class="game-btn" onclick="startGame(1)">⚡ Reaction Test</button>
            <button class="game-btn" onclick="startGame(2)">🧠 Memory Match</button>
            <button class="game-btn" onclick="startGame(3)">🔤 Word Scramble</button>
            <button class="close-modal" onclick="closeModal()">Back to Reading</button>
        </div>

        <!-- GAME 1 -->
        <div id="game-1" class="game-arena">
            <h3 style="color:white; margin-bottom:1rem;">⚡ Reaction Test</h3>
            <p style="color:#8b949e; margin-bottom:1rem;">Tap the box as soon as it turns green.</p>
            <div id="reaction-box" onclick="reactionClick()"><span id="reaction-text">Wait for green...</span></div>
            <button class="close-modal" onclick="closeModal()" style="margin-top:1rem;">Back</button>
        </div>

        <!-- GAME 2 -->
        <div id="game-2" class="game-arena">
            <h3 style="color:white; margin-bottom:1rem;">🧠 Memory Match</h3>
            <div class="memory-grid" id="memory-grid"></div>
            <button class="close-modal" onclick="closeModal()">Back</button>
        </div>

        <!-- GAME 3 -->
        <div id="game-3" class="game-arena">
            <h3 style="color:white; margin-bottom:1rem;">🔤 Word Scramble</h3>
            <div class="scramble-word" id="scramble-word">LOADING</div>
            <input type="text" id="scramble-input" placeholder="Type the word..." autocomplete="off">
            <button id="scramble-submit" onclick="checkScramble()">Submit</button>
            <div id="scramble-msg" style="color:#8b949e; margin-top:1rem; font-size:0.9rem;"></div>
            <button class="close-modal" onclick="closeModal()" style="margin-top:1rem;">Back</button>
        </div>
    </div>
</div>

<script>
(function(){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // ===== DOM =====
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const readerContainer = document.getElementById('reader-container');
    const playBtn = document.getElementById('play-btn');
    const speechPanel = document.getElementById('speech-panel');
    const spokenTextEl = document.getElementById('spoken-text');
    const toggleTextBtn = document.getElementById('toggle-text-btn');
    const closeTextBtn = document.getElementById('close-text-btn');
    const themeToggle = document.getElementById('theme-toggle');

    // ===== STATE =====
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 1;
    let currentScale = 1.0;
    
    // Speech State
    const synth = window.speechSynthesis;
    let isSpeaking = false;
    let sentences = [];
    let sentenceEls = [];
    let currentSentenceIdx = -1;
    let autoAdvancePage = true;
    let availableVoices = [];
    let selectedVoiceName = null;

    // ===== LOAD THE BOOK =====
    async function loadPDF() {
        try {
            playBtn.textContent = 'Loading...';
            playBtn.disabled = true;
            const response = await fetch('./ForbiddenKnowledge2026.pdf');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const arrayBuffer = await response.arrayBuffer();
            
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            
            await renderPage(1);
            playBtn.textContent = '▶ Read to Me';
            playBtn.disabled = false;
        } catch (err) {
            console.error(err);
            playBtn.textContent = '❌ Error Loading Book';
            playBtn.style.background = '#da3633';
        }
    }

    async function renderPage(pageNum) {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pageNum);
        // Fit to screen width
        const containerWidth = readerContainer.clientWidth - 40;
        const viewport = page.getViewport({ scale: 1.0 });
        currentScale = containerWidth / viewport.width;
        const scaledViewport = page.getViewport({ scale: currentScale });
        
        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
        currentPage = pageNum;
        
        // Auto-scroll to top on new page
        readerContainer.scrollTop = 0;
    }

    // ===== SPEECH ENGINE =====
    function populateVoices() {
        availableVoices = synth.getVoices();
        if (availableVoices.length > 0 && !selectedVoiceName) {
            const enIdx = availableVoices.findIndex(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            selectedVoiceName = availableVoices[enIdx >= 0 ? enIdx : 0].name;
        }
    }
    if (typeof speechSynthesis !== 'undefined') {
        populateVoices();
        speechSynthesis.onvoiceschanged = populateVoices;
    }

    async function extractPageText(pageNum) {
        if (!pdfDoc) return '';
        try {
            const page = await pdfDoc.getPage(pageNum);
            const tc = await page.getTextContent();
            let text = '';
            tc.items.forEach(item => {
                const s = item.str;
                if (!s) return;
                if (text && !/\s$/.test(text) && !/^[.,;:!?)\]]/.test(s)) text += ' ';
                text += s;
            });
            return text.replace(/\s+/g, ' ').trim();
        } catch (e) { return ''; }
    }

    function splitIntoSentences(text) {
        if (!text) return [];
        const rough = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
        return rough.map(s => s.trim()).filter(s => s.length > 0);
    }

    function displaySentences(arr) {
        spokenTextEl.innerHTML = '';
        sentenceEls = [];
        if (!arr.length) {
            spokenTextEl.innerHTML = '<div style="opacity:0.5; font-style:italic;">No readable text on this page (image or QR code only). Skipping ahead...</div>';
            return;
        }
        arr.forEach((s, i) => {
            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = s + ' ';
            spokenTextEl.appendChild(span);
            sentenceEls.push(span);
        });
    }

    function highlightSentence(idx) {
        sentenceEls.forEach(el => el.classList.remove('active'));
        if (idx >= 0 && idx < sentenceEls.length) {
            const el = sentenceEls[idx];
            el.classList.add('active');
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    async function prepareSpeech() {
        const raw = await extractPageText(currentPage);
        const arr = splitIntoSentences(raw);
        sentences = arr.map((t, i) => ({ text: t, index: i }));
        displaySentences(arr);
        return arr.length;
    }

    function speakFromIndex(startIdx) {
        synth.cancel();
        isSpeaking = true;
        playBtn.textContent = '⏸ Stop Reading';
        playBtn.classList.add('stop-mode');

        const speakNext = (idx) => {
            if (!isSpeaking) return;
            if (idx >= sentences.length) {
                highlightSentence(-1);
                if (autoAdvancePage && currentPage < totalPages) {
                    setTimeout(async () => {
                        if (!isSpeaking) return;
                        await renderPage(currentPage + 1);
                        const count = await prepareSpeech();
                        if (count > 0) speakFromIndex(0);
                        else goToPageAndRead(currentPage + 1);
                    }, 800);
                } else {
                    stopSpeakingUI();
                }
                return;
            }
            
            const u = new SpeechSynthesisUtterance(sentences[idx].text);
            if (selectedVoiceName) {
                const v = availableVoices.find(v => v.name === selectedVoiceName);
                if (v) u.voice = v;
            }
            u.onstart = () => highlightSentence(idx);
            u.onend = () => { if (isSpeaking) speakNext(idx + 1); };
            u.onerror = () => { if (isSpeaking) speakNext(idx + 1); };
            synth.speak(u);
        };
        speakNext(startIdx);
    }

    function stopSpeakingUI() {
        isSpeaking = false;
        playBtn.textContent = '▶ Read to Me';
        playBtn.classList.remove('stop-mode');
        highlightSentence(-1);
    }

    playBtn.addEventListener('click', async () => {
        if (isSpeaking) {
            synth.cancel();
            stopSpeakingUI();
            return;
        }
        playBtn.textContent = 'Loading Text...';
        const count = await prepareSpeech();
        if (count > 0) {
            speakFromIndex(0);
        } else {
            // Skip image-only page
            if (currentPage < totalPages) {
                await renderPage(currentPage + 1);
                playBtn.click(); // restart on next page
            } else {
                playBtn.textContent = '▶ Read to Me';
                alert('No more readable text in the book.');
            }
        }
    });

    async function goToPageAndRead(pageNum) {
        await renderPage(pageNum);
        const count = await prepareSpeech();
        if (count > 0) speakFromIndex(0);
        else if (currentPage < totalPages) goToPageAndRead(currentPage + 1);
        else stopSpeakingUI();
    }

    // ===== UI TOGGLES =====
    toggleTextBtn.addEventListener('click', () => speechPanel.classList.toggle('hidden'));
    closeTextBtn.addEventListener('click', () => speechPanel.classList.add('hidden'));
    
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light');
    });

    // Resize handler to keep PDF fitting screen
    window.addEventListener('resize', () => {
        if (pdfDoc) renderPage(currentPage);
    });

    // ===== SECRET TRIPLE TAP GAME MENU =====
    let tapCount = 0;
    let tapTimer = null;
    
    document.addEventListener('click', (e) => {
        // Ignore taps on buttons to prevent accidental opening
        if (e.target.closest('button') || e.target.closest('.game-menu')) return;

        tapCount++;
        if (tapCount === 1) {
            tapTimer = setTimeout(() => { tapCount = 0; }, 600);
        }
        if (tapCount === 3) {
            clearTimeout(tapTimer);
            tapCount = 0;
            document.getElementById('game-modal').classList.add('show');
            document.getElementById('menu-view').style.display = 'block';
            document.querySelectorAll('.game-arena').forEach(el => el.classList.remove('active'));
        }
    });

    window.closeModal = function() {
        document.getElementById('game-modal').classList.remove('show');
        synth.cancel(); // stop any reading
        stopSpeakingUI();
    };

    // ===== MINI GAMES LOGIC =====
    window.startGame = function(id) {
        document.getElementById('menu-view').style.display = 'none';
        document.querySelectorAll('.game-arena').forEach(el => el.classList.remove('active'));
        document.getElementById('game-' + id).classList.add('active');
        
        if (id === 1) initReaction();
        if (id === 2) initMemory();
        if (id === 3) initScramble();
    };

    // Game 1: Reaction Test
    let reactionState = 'waiting';
    let reactionTimeout = null;
    let startTime = 0;
    function initReaction() {
        reactionState = 'waiting';
        const box = document.getElementById('reaction-box');
        const text = document.getElementById('reaction-text');
        box.classList.remove('ready');
        box.style.background = '#da3633';
        text.textContent = 'Wait for green...';
        
        reactionTimeout = setTimeout(() => {
            reactionState = 'ready';
            box.style.background = '#238636';
            text.textContent = 'TAP NOW!';
            startTime = Date.now();
        }, Math.random() * 3000 + 1500);
    }
    window.reactionClick = function() {
        if (reactionState === 'waiting') {
            clearTimeout(reactionTimeout);
            document.getElementById('reaction-text').textContent = 'Too early! Click Back and try again.';
            reactionState = 'failed';
        } else if (reactionState === 'ready') {
            const time = Date.now() - startTime;
            document.getElementById('reaction-text').textContent = `${time} ms! ⚡`;
            reactionState = 'done';
        }
    };

    // Game 2: Memory Match
    const symbols = ['🚀','🧠','🔥','💎','🌟','🎯'];
    let flippedCards = [];
    let matchedPairs = 0;
    function initMemory() {
        const grid = document.getElementById('memory-grid');
        grid.innerHTML = '';
        flippedCards = [];
        matchedPairs = 0;
        
        let deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
        deck.forEach((sym, i) => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.symbol = sym;
            card.dataset.idx = i;
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });
    }
    function flipCard(card) {
        if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;
        
        card.classList.add('flipped');
        card.textContent = card.dataset.symbol;
        flippedCards.push(card);
        
        if (flippedCards.length === 2) {
            if (flippedCards[0].dataset.symbol === flippedCards[1].dataset.symbol) {
                flippedCards[0].classList.add('matched');
                flippedCards[1].classList.add('matched');
                flippedCards = [];
                matchedPairs++;
                if (matchedPairs === 6) {
                    setTimeout(() => alert('You won! 🎉'), 300);
                }
            } else {
                setTimeout(() => {
                    flippedCards[0].classList.remove('flipped');
                    flippedCards[1].classList.remove('flipped');
                    flippedCards[0].textContent = '';
                    flippedCards[1].textContent = '';
                    flippedCards = [];
                }, 800);
            }
        }
    }

    // Game 3: Word Scramble
    const words = ['MAGIC', 'POWER', 'FREEDOM', 'KNOWLEDGE', 'SECRET', 'FUTURE', 'LIGHT'];
    let currentWord = '';
    function initScramble() {
        currentWord = words[Math.floor(Math.random() * words.length)];
        const scrambled = currentWord.split('').sort(() => Math.random() - 0.5).join('');
        document.getElementById('scramble-word').textContent = scrambled;
        document.getElementById('scramble-input').value = '';
        document.getElementById('scramble-msg').textContent = '';
        document.getElementById('scramble-input').focus();
    }
    window.checkScramble = function() {
        const val = document.getElementById('scramble-input').value.toUpperCase();
        if (val === currentWord) {
            document.getElementById('scramble-msg').textContent = 'Correct! 🎉';
            document.getElementById('scramble-msg').style.color = '#238636';
            setTimeout(() => { closeModal(); }, 1500);
        } else {
            document.getElementById('scramble-msg').textContent = 'Not quite. Try again!';
            document.getElementById('scramble-msg').style.color = '#da3633';
        }
    };

    // ===== INIT =====
    loadPDF();

})();
</script>
</body>
</html>
