<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Don Ramiro · Calculadora + Conversor</title>
    <!-- sponsored by TripsToColombia.com -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2f;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }
        .app {
            max-width: 820px;
            width: 100%;
            background: #1f3a5f;
            border-radius: 64px 64px 48px 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 2px #4d7bb3 inset;
            transition: all 0.1s;
        }

        /* HEADER */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .header h1 {
            color: #f7e9c3;
            font-size: 2.3rem;
            font-weight: 500;
            text-shadow: 0 3px 0 #0b1a2f;
            background: #2b4b72;
            padding: 0 22px 0 16px;
            border-radius: 60px;
            line-height: 1.4;
            box-shadow: 0 2px 0 #6f9ed8;
        }
        .sponsor {
            background: #d9b650;
            color: #0b1a2f;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 4px 22px 4px 18px;
            border-radius: 50px;
            box-shadow: 0 3px 0 #7f5f1a;
            border: 1px solid #fae284;
            margin-top: 4px;
        }
        .sponsor a {
            color: #0b1a2f;
            text-decoration: none;
        }
        .sponsor a:hover { text-decoration: underline; }

        /* PANTALLA PRINCIPAL (resultado) */
        .main-screen {
            background: #dce8f5;
            border-radius: 48px;
            padding: 16px 28px;
            margin-bottom: 16px;
            box-shadow: 0 6px 0 #0b1a2f, 0 12px 20px rgba(0,0,0,0.4);
            border: 2px solid #b8cfec;
        }
        #display {
            font-size: 4.2rem;
            font-weight: 700;
            color: #04111f;
            text-align: right;
            letter-spacing: 2px;
            line-height: 1.3;
            min-height: 5.5rem;
            word-break: break-all;
            font-family: 'Courier New', 'Consolas', monospace;
            background: #f0f7ff;
            padding: 0 20px;
            border-radius: 40px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* TECLADO NUMÉRICO + OPERACIONES */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px 14px;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        .btn {
            background: #eef4fc;
            border: none;
            border-radius: 60px;
            padding: 22px 0;
            font-size: 2.6rem;
            font-weight: 700;
            color: #0b1a2f;
            box-shadow: 0 7px 0 #7d8fa3, 0 8px 12px rgba(0,0,0,0.4);
            transition: all 0.06s ease;
            cursor: pointer;
            line-height: 1;
            text-align: center;
            font-family: 'Segoe UI', system-ui;
            letter-spacing: 1px;
            border: 1px solid #d5e2f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #5d6f83;
        }
        .btn-operator {
            background: #ffc857;
            color: #0f1f2e;
            box-shadow: 0 7px 0 #b8842a;
            border-color: #f5b83a;
        }
        .btn-equals {
            background: #6fbf73;
            color: white;
            box-shadow: 0 7px 0 #2b7a2f;
            border-color: #5ba85f;
            font-size: 3.2rem;
        }
        .btn-clear {
            background: #e26b6b;
            color: white;
            box-shadow: 0 7px 0 #8f3f3f;
            border-color: #d45a5a;
        }
        .btn-zero {
            grid-column: span 2;
        }
        .btn-convert {
            background: #4c8bcb;
            color: white;
            box-shadow: 0 7px 0 #1f4d77;
            border-color: #3e7bb8;
            font-size: 2.2rem;
        }

        /* ===== CONVERTIDOR (abajo) ===== */
        .converter-section {
            background: #1e3d5e;
            border-radius: 60px;
            padding: 20px 20px 22px;
            margin-top: 4px;
            box-shadow: 0 5px 0 #0d1f31, inset 0 0 0 2px #3973a6;
        }
        .converter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 16px;
        }
        .conv-group {
            display: flex;
            align-items: center;
            background: #24486e;
            border-radius: 60px;
            padding: 0 12px 0 18px;
            box-shadow: inset 0 2px 6px #0b1a2f, 0 3px 0 #16334f;
            flex: 1 1 220px;
        }
        .conv-group label {
            color: #fbeba0;
            font-weight: 600;
            font-size: 1.7rem;
            margin-right: 10px;
            letter-spacing: 0.5px;
        }
        .conv-group input {
            background: #f2faff;
            border: none;
            padding: 16px 12px;
            font-size: 2.2rem;
            font-weight: 600;
            width: 100%;
            min-width: 100px;
            border-radius: 40px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #04111f;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.3);
            outline: 2px solid #aac2e3;
            transition: 0.1s;
            margin: 6px 0;
        }
        .conv-group input:focus {
            outline: 4px solid #f5c542;
            background: #ffffff;
        }
        .conv-group input::placeholder {
            color: #3a5f7a;
            font-size: 1.5rem;
            opacity: 0.6;
        }
        .conv-rate-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            margin-top: 12px;
            background: #0f2a44;
            border-radius: 60px;
            padding: 8px 20px 10px;
            border: 1px solid #4f7aa8;
        }
        .conv-rate {
            color: #cddfed;
            font-size: 1.8rem;
            font-weight: 600;
            background: #0b253f;
            padding: 4px 24px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px #0b1a2f;
            white-space: nowrap;
        }
        .conv-rate span {
            color: #fdde6c;
        }
        .rate-control {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .rate-control input {
            background: #f2faff;
            border: none;
            padding: 8px 12px;
            font-size: 1.8rem;
            font-weight: 600;
            width: 120px;
            border-radius: 40px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #04111f;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.3);
            outline: 2px solid #aac2e3;
        }
        .rate-control input:focus {
            outline: 4px solid #f5c542;
        }
        .rate-control button {
            background: #d9b650;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b1a2f;
            box-shadow: 0 4px 0 #7f5f1a;
            cursor: pointer;
            transition: 0.05s linear;
            border: 1px solid #fae284;
        }
        .rate-control button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7f5f1a;
        }
        .rate-control label {
            color: #c7def5;
            font-size: 1.4rem;
            font-weight: 500;
        }
        /* pequeño botón para usar el valor actual de pantalla en conversor */
        .use-display-btn {
            background: #4c8bcb;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
            box-shadow: 0 4px 0 #1f4d77;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .use-display-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1f4d77;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #99badd;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            border-top: 1px solid #2f5277;
            padding-top: 16px;
        }
        .footer a {
            color: #f7e379;
            font-weight: 600;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
        .footer small { font-size: 1rem; opacity: 0.8; }

        @media (max-width: 640px) {
            .app { padding: 16px 12px; }
            .header h1 { font-size: 1.8rem; }
            .sponsor { font-size: 1.0rem; padding: 2px 14px; }
            #display { font-size: 3.4rem; min-height: 4.6rem; }
            .conv-group input { font-size: 1.8rem; padding: 12px 6px; min-width: 70px; }
            .btn { font-size: 2.2rem; padding: 18px 0; }
            .conv-rate { font-size: 1.4rem; padding: 2px 14px; }
            .rate-control input { width: 90px; font-size: 1.4rem; }
        }
        @media (max-width: 420px) {
            .btn { font-size: 1.8rem; padding: 14px 0; }
            .conv-group label { font-size: 1.3rem; }
            .conv-group input { font-size: 1.4rem; }
        }
        .btn, .conv-group input, .rate-control button, .use-display-btn { touch-action: manipulation; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🧮 Don Ramiro</h1>
        <div class="sponsor"><a href="#" onclick="alert('¡Gracias por usar TripsToColombia.com! 🇨🇴')">TripsToColombia.com</a></div>
    </div>

    <!-- Pantalla -->
    <div class="main-screen">
        <div id="display">0</div>
    </div>

    <!-- Teclado -->
    <div class="keypad">
        <button class="btn btn-clear" id="clearBtn">AC</button>
        <button class="btn btn-operator" id="operatorBtn" data-op="/">÷</button>
        <button class="btn btn-operator" data-op="*">×</button>
        <button class="btn btn-clear" id="backspaceBtn">⌫</button>

        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn btn-operator" data-op="-">−</button>

        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn btn-operator" data-op="+">+</button>

        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn btn-equals" id="equalsBtn">=</button>

        <button class="btn btn-zero" data-num="0">0</button>
        <button class="btn" data-num=".">.</button>
        <button class="btn btn-convert" id="convertBtn">⇄ Conv</button>
    </div>

    <!-- ===== CONVERTIDOR (ahora abajo) ===== -->
    <div class="converter-section">
        <div class="converter-row">
            <div class="conv-group">
                <label>🇺🇸</label>
                <input type="number" id="usdInput" placeholder="USD" step="any" min="0" value="1">
            </div>
            <div class="conv-group">
                <label>🇨🇴</label>
                <input type="number" id="copInput" placeholder="COP" step="any" min="0" value="3900">
            </div>
            <button class="use-display-btn" id="useDisplayBtn">📥 usar pantalla</button>
        </div>

        <div class="conv-rate-box">
            <div class="conv-rate">
                <span id="rateDisplay">1 USD ≈ 3900 COP</span>
            </div>
            <div class="rate-control">
                <label>tasa</label>
                <input type="number" id="rateInput" value="3900" step="10" min="1">
                <button id="setRateBtn">⏺ fijar</button>
                <button id="fetchRateBtn" style="background:#6fbf73; box-shadow:0 4px 0 #2b7a2f; border-color:#5ba85f;">📡 actual</button>
            </div>
        </div>
        <div style="font-size:1.2rem; color:#b0cee8; text-align:center; margin-top:6px;">
            <span>💡 Escribe el monto y el otro se ajusta · tasa modificable</span>
        </div>
    </div>

    <div class="footer">
        <span>🇨🇴 <a href="#" onclick="alert('Con amor para Ramiro Ramírez León · TripsToColombia.com')">Ramiro Ramírez León</a> · siempre a tu lado</span>
        <br><small>pantalla gigante · alto contraste</small>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- ELEMENTOS -----
        const display = document.getElementById('display');
        const clearBtn = document.getElementById('clearBtn');
        const backspaceBtn = document.getElementById('backspaceBtn');
        const equalsBtn = document.getElementById('equalsBtn');
        const convertBtn = document.getElementById('convertBtn');
        const usdInput = document.getElementById('usdInput');
        const copInput = document.getElementById('copInput');
        const rateInput = document.getElementById('rateInput');
        const rateDisplay = document.getElementById('rateDisplay');
        const setRateBtn = document.getElementById('setRateBtn');
        const fetchRateBtn = document.getElementById('fetchRateBtn');
        const useDisplayBtn = document.getElementById('useDisplayBtn');

        // ----- ESTADO CALCULADORA -----
        let currentInput = '0';
        let previousValue = null;
        let currentOperator = null;
        let resetDisplay = false;

        function updateDisplay() {
            let str = currentInput;
            if (str.length > 16) {
                if (str.includes('.')) {
                    str = parseFloat(str).toExponential(6);
                } else {
                    str = str.slice(0, 16);
                }
            }
            display.textContent = str || '0';
        }

        function inputDigit(digit) {
            if (resetDisplay) {
                currentInput = digit === '.' ? '0.' : digit;
                resetDisplay = false;
            } else {
                if (digit === '.' && currentInput.includes('.')) return;
                if (currentInput === '0' && digit !== '.') {
                    currentInput = digit;
                } else {
                    currentInput += digit;
                }
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousValue = null;
            currentOperator = null;
            resetDisplay = false;
            updateDisplay();
        }

        function backspace() {
            if (resetDisplay) { clearAll(); return; }
            if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
            else currentInput = '0';
            updateDisplay();
        }

        function handleOperator(op) {
            const currentNumber = parseFloat(currentInput);
            if (isNaN(currentNumber)) { clearAll(); return; }
            if (previousValue !== null && currentOperator !== null && !resetDisplay) {
                const result = compute(previousValue, currentNumber, currentOperator);
                if (!isFinite(result) || isNaN(result)) { display.textContent = 'Error'; clearAll(); return; }
                currentInput = String(result);
                previousValue = result;
            } else {
                previousValue = currentNumber;
            }
            currentOperator = op;
            resetDisplay = true;
            updateDisplay();
        }

        function compute(a, b, op) {
            switch (op) {
                case '+': return a + b;
                case '-': return a - b;
                case '*': return a * b;
                case '/': return b !== 0 ? a / b : NaN;
                default: return b;
            }
        }

        function calculateResult() {
            if (currentOperator === null || previousValue === null) return;
            const currentNumber = parseFloat(currentInput);
            if (isNaN(currentNumber)) { clearAll(); return; }
            const result = compute(previousValue, currentNumber, currentOperator);
            if (!isFinite(result) || isNaN(result)) { display.textContent = 'Error'; clearAll(); return; }
            const rounded = parseFloat(result.toPrecision(12));
            currentInput = String(rounded);
            previousValue = null;
            currentOperator = null;
            resetDisplay = true;
            updateDisplay();
        }

        // ----- CONVERSOR -----
        function getRate() {
            let r = parseFloat(rateInput.value);
            if (isNaN(r) || r <= 0) r = 3900;
            return r;
        }

        function updateRateDisplay() {
            const rate = getRate();
            rateDisplay.textContent = `1 USD ≈ ${Math.round(rate)} COP`;
        }

        function convertUSDtoCOP() {
            const usd = parseFloat(usdInput.value);
            if (isNaN(usd) || usd < 0) { copInput.value = ''; return; }
            const rate = getRate();
            copInput.value = (usd * rate).toFixed(2);
        }

        function convertCOPtoUSD() {
            const cop = parseFloat(copInput.value);
            if (isNaN(cop) || cop < 0) { usdInput.value = ''; return; }
            const rate = getRate();
            if (rate === 0) return;
            usdInput.value = (cop / rate).toFixed(4);
        }

        function syncUSD() { convertUSDtoCOP(); }
        function syncCOP() { convertCOPtoUSD(); }

        function setRate() {
            let r = parseFloat(rateInput.value);
            if (isNaN(r) || r <= 0) r = 3900;
            rateInput.value = r;
            updateRateDisplay();
            syncUSD();
            syncCOP();
        }

        // Obtener tasa actual desde API (USDCOP) - con fallback
        function fetchLiveRate() {
            fetchRateBtn.textContent = '⏳';
            fetchRateBtn.disabled = true;
            // Usamos una API pública gratuita
            fetch('https://api.exchangerate-api.com/v4/latest/USD')
                .then(res => {
                    if (!res.ok) throw new Error('Network');
                    return res.json();
                })
                .then(data => {
                    const cop = data.rates?.COP;
                    if (cop && typeof cop === 'number' && cop > 0) {
                        rateInput.value = Math.round(cop);
                        setRate();
                        fetchRateBtn.textContent = '📡 actual';
                        fetchRateBtn.disabled = false;
                    } else {
                        throw new Error('Invalid rate');
                    }
                })
                .catch(() => {
                    // fallback: intentar otra API
                    fetch('https://api.frankfurter.app/latest?from=USD&to=COP')
                        .then(r => r.json())
                        .then(data => {
                            const cop = data.rates?.COP;
                            if (cop && typeof cop === 'number' && cop > 0) {
                                rateInput.value = Math.round(cop);
                                setRate();
                            } else {
                                alert('No se pudo obtener tasa actual. Usa la tasa manual.');
                            }
                        })
                        .catch(() => {
                            alert('Error al obtener tasa. Verifica conexión o usa tasa manual.');
                        })
                        .finally(() => {
                            fetchRateBtn.textContent = '📡 actual';
                            fetchRateBtn.disabled = false;
                        });
                });
        }

        // Botón "usar pantalla": toma el valor del display y lo pone en USD o COP según corresponda
        function useDisplayInConverter() {
            const val = parseFloat(currentInput);
            if (isNaN(val) || val < 0) {
                alert('El valor en pantalla no es un número válido');
                return;
            }
            // Si el valor en COP input es 0 o vacío, asumimos que queremos poner en USD
            // mejor: si el display tiene un número grande, lo ponemos en COP? 
            // Decisión: ponemos el valor en USD y convertimos a COP
            usdInput.value = val;
            syncUSD();
            // también actualizamos el display? no, solo los inputs.
        }

        // ----- EVENTOS -----
        document.querySelectorAll('.btn[data-num]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const digit = btn.getAttribute('data-num');
                inputDigit(digit);
            });
        });

        document.querySelectorAll('.btn-operator').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const op = btn.getAttribute('data-op');
                if (op) handleOperator(op);
            });
        });

        clearBtn.addEventListener('click', clearAll);
        backspaceBtn.addEventListener('click', backspace);
        equalsBtn.addEventListener('click', calculateResult);

        // Botón convertir: toma el display y lo convierte según tasa (USD -> COP o COP -> USD)
        convertBtn.addEventListener('click', function() {
            const displayNum = parseFloat(currentInput);
            if (isNaN(displayNum) || displayNum < 0) {
                alert('Ingresa un número válido en la pantalla');
                return;
            }
            const rate = getRate();
            // Si el display coincide con el valor en USD input (con tolerancia), convertimos a COP
            const usdVal = parseFloat(usdInput.value);
            const copVal = parseFloat(copInput.value);
            if (!isNaN(usdVal) && Math.abs(displayNum - usdVal) < 0.0001) {
                // USD -> COP
                const newCop = displayNum * rate;
                copInput.value = newCop.toFixed(2);
                currentInput = String(newCop);
                resetDisplay = true;
                updateDisplay();
            } else if (!isNaN(copVal) && Math.abs(displayNum - copVal) < 0.0001) {
                // COP -> USD
                const newUsd = displayNum / rate;
                usdInput.value = newUsd.toFixed(4);
                currentInput = String(newUsd);
                resetDisplay = true;
                updateDisplay();
            } else {
                // por defecto: tratar como USD y convertir a COP
                const newCop = displayNum * rate;
                copInput.value = newCop.toFixed(2);
                currentInput = String(newCop);
                resetDisplay = true;
                updateDisplay();
            }
        });

        // Inputs conversor
        usdInput.addEventListener('input', syncUSD);
        copInput.addEventListener('input', syncCOP);

        // Tasa
        rateInput.addEventListener('change', setRate);
        setRateBtn.addEventListener('click', setRate);
        fetchRateBtn.addEventListener('click', fetchLiveRate);

        // Botón usar pantalla
        useDisplayBtn.addEventListener('click', useDisplayInConverter);

        // Inicializar
        (function init() {
            rateInput.value = '3900';
            updateRateDisplay();
            usdInput.value = '1';
            copInput.value = '3900';
            clearAll();
            // intentar obtener tasa al cargar
            setTimeout(fetchLiveRate, 600);
        })();

        // Teclado físico
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key >= '0' && key <= '9') { e.preventDefault(); inputDigit(key); }
            else if (key === '.') { e.preventDefault(); inputDigit('.'); }
            else if (key === 'Enter' || key === '=') { e.preventDefault(); calculateResult(); }
            else if (key === 'Backspace') { e.preventDefault(); backspace(); }
            else if (key === 'Escape' || key === 'c' || key === 'C') { e.preventDefault(); clearAll(); }
            else if (key === '+') { e.preventDefault(); handleOperator('+'); }
            else if (key === '-') { e.preventDefault(); handleOperator('-'); }
            else if (key === '*') { e.preventDefault(); handleOperator('*'); }
            else if (key === '/') { e.preventDefault(); handleOperator('/'); }
        });

        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') e.preventDefault();
            });
            inp.addEventListener('focus', function() { this.select(); });
        });

        console.log('💛 App para Don Ramiro · TripsToColombia.com');
    })();
</script>
</body>
</html>
