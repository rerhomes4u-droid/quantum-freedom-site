<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbidden Knowledge — Chapter 9: The Martyrs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

  :root {
    --bg: #08080a; --bg-2: #0c0c10; --surface: #121218; --surface-2: #1a1a22; --surface-3: #22222c;
    --border: #2a2a36; --border-2: #3a3a48;
    --text: #eae8e4; --text-dim: #9a978f; --text-faint: #6a6770;
    --accent: #c9a227; --accent-2: #e8c547;
    --danger: #c0392b; --danger-2: #e74c3c;
    --suppressed: #8b6bb5; --suppressed-2: #a68cc9;
    --verified: #3a9d6c; --unverified: #b8922a; --disputed: #b03a2e;
    --martyr: #d9463d; --martyr-2: #ff6b5e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    line-height: 1.65; font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; min-height: 100vh;
  }

  #ambient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.5; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 160px; position: relative; z-index: 1; }

  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, var(--martyr), var(--accent));
    z-index: 1000; width: 0%; transition: width 0.1s;
    box-shadow: 0 0 12px var(--martyr);
  }

  .nav {
    position: sticky; top: 0;
    background: rgba(8,8,10,0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border); z-index: 100; padding: 10px 0;
  }
  .nav-inner {
    max-width: 1000px; margin: 0 auto; padding: 0 24px;
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.15em;
    color: var(--martyr); font-weight: 600; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-brand::before {
    content: ''; width: 6px; height: 6px; background: var(--martyr); border-radius: 50%;
    box-shadow: 0 0 8px var(--martyr); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .nav-links { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
  .nav a {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); text-decoration: none;
    padding: 6px 10px; border-radius: 2px; transition: all 0.2s; white-space: nowrap;
  }
  .nav a:hover, .nav a.active { color: var(--martyr); background: var(--surface); }

  .cmd-hint {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 3px;
    cursor: pointer; transition: all 0.2s; background: transparent;
  }
  .cmd-hint:hover { border-color: var(--martyr); color: var(--martyr); }

  .cmd-palette {
    position: fixed; top: 15%; left: 50%;
    transform: translateX(-50%) scale(0.95);
    width: min(600px, 92vw); background: var(--surface-2);
    border: 1px solid var(--martyr); border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(217,70,61,0.15);
    z-index: 2000; opacity: 0; pointer-events: none;
    transition: all 0.2s; overflow: hidden;
  }
  .cmd-palette.open { opacity: 1; pointer-events: all; transform: translateX(-50%) scale(1); }
  .cmd-input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border);
    padding: 18px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    color: var(--text); outline: none;
  }
  .cmd-input::placeholder { color: var(--text-faint); }
  .cmd-results { max-height: 400px; overflow-y: auto; }
  .cmd-item {
    padding: 12px 22px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background 0.15s; display: flex; justify-content: space-between;
    align-items: center; gap: 12px;
  }
  .cmd-item:hover, .cmd-item.selected { background: var(--surface-3); }
  .cmd-item-name { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); }
  .cmd-item-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); letter-spacing: 0.05em; }
  .cmd-empty { padding: 30px 22px; text-align: center; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }

  header { padding: 80px 0 48px; border-bottom: 1px solid var(--border); margin-bottom: 56px; position: relative; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--martyr); margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .kicker::before { content: ''; width: 32px; height: 1px; background: var(--martyr); }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(38px, 7vw, 68px);
    font-weight: 600; line-height: 1.02; letter-spacing: -0.02em; margin-bottom: 24px;
    background: linear-gradient(180deg, var(--text) 0%, var(--martyr-2) 140%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { font-size: 19px; color: var(--text-dim); max-width: 720px; font-weight: 300; line-height: 1.65; }
  .subtitle em { color: var(--martyr-2); font-style: italic; }
  .method-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 36px; }
  .method-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 3px; color: var(--text-dim);
    letter-spacing: 0.05em; background: var(--surface); transition: all 0.2s;
  }
  .method-chip:hover { border-color: var(--martyr); color: var(--martyr); }
  .method-chip strong { color: var(--martyr); font-weight: 600; }

  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin: 40px 0;
  }
  .stat { background: var(--surface); padding: 20px 18px; text-align: center; transition: background 0.2s; }
  .stat:hover { background: var(--surface-2); }
  .stat-num {
    font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600;
    color: var(--martyr); line-height: 1; display: block; margin-bottom: 6px;
  }
  .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); }

  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 40px 0 24px;
    padding: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; align-items: center;
  }
  .filter-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin-right: 8px; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 2px;
    cursor: pointer; transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--martyr); color: var(--martyr); }
  .filter-btn.active { background: var(--martyr); color: var(--bg); border-color: var(--martyr); font-weight: 600; }
  .filter-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); letter-spacing: 0.05em; }

  .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 24px; }
  .case-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--martyr); border-radius: 4px;
    padding: 22px 22px 20px; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; overflow: hidden;
  }
  .case-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at top right, rgba(217,70,61,0.1), transparent 60%);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .case-card:hover { border-color: var(--martyr); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(217,70,61,0.15), 0 0 0 1px var(--martyr); }
  .case-card:hover::before { opacity: 1; }
  .case-card.opened { background: var(--surface-2); }
  .case-card.opened::after {
    content: '✓ READ'; position: absolute; top: 12px; right: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.1em;
    color: var(--verified); background: rgba(58,157,108,0.1);
    padding: 2px 6px; border-radius: 2px; border: 1px solid rgba(58,157,108,0.3);
  }
  .case-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--martyr); letter-spacing: 0.15em; margin-bottom: 8px; display: block; }
  .case-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; color: var(--text); }
  .case-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .case-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 7px; border-radius: 2px;
    border: 1px solid var(--border-2); color: var(--text-faint);
  }
  .case-tag.era { border-color: var(--suppressed); color: var(--suppressed); }
  .case-tag.cause { border-color: var(--accent); color: var(--accent); }
  .case-tag.fate { border-color: var(--martyr); color: var(--martyr); }
  .case-excerpt { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin-bottom: 12px; }
  .case-cta {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
    color: var(--martyr); text-transform: uppercase;
    display: flex; align-items: center; gap: 6px; transition: gap 0.2s;
  }
  .case-card:hover .case-cta { gap: 10px; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 1500; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 8px;
    max-width: 780px; width: 100%; position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(217,70,61,0.1);
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: var(--surface-2);
    border: 1px solid var(--border-2); color: var(--text-dim);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s; z-index: 10;
  }
  .modal-close:hover { border-color: var(--martyr); color: var(--martyr); transform: rotate(90deg); }
  .modal-header { padding: 40px 40px 24px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(217,70,61,0.05), transparent); }
  .modal-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--martyr); text-transform: uppercase; margin-bottom: 10px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; line-height: 1.1; margin-bottom: 14px; color: var(--text); }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .modal-body { padding: 32px 40px 40px; }
  .modal-section { margin-bottom: 28px; }
  .modal-section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--martyr); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .modal-section p { font-size: 15px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }
  .modal-section p:last-child { margin-bottom: 0; }
  .modal-verdict { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--martyr); border-radius: 4px; padding: 20px 22px; margin-top: 8px; }
  .modal-verdict .v {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 3px 8px;
    border-radius: 2px; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 10px; display: inline-block;
  }
  .v-verified { background: rgba(58,157,108,0.15); color: var(--verified); border: 1px solid var(--verified); }
  .v-unverified { background: rgba(184,146,42,0.15); color: var(--unverified); border: 1px solid var(--unverified); }
  .v-disputed { background: rgba(176,58,46,0.15); color: var(--disputed); border: 1px solid var(--disputed); }
  .v-suppressed { background: rgba(139,107,181,0.15); color: var(--suppressed); border: 1px solid var(--suppressed); }
  .modal-gap { background: var(--surface-2); border: 1px solid var(--martyr); border-left: 3px solid var(--martyr); border-radius: 4px; padding: 22px 24px; margin-top: 8px; }
  .modal-gap .label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--martyr); margin-bottom: 8px; }
  .modal-gap p { font-size: 14px; color: var(--text-dim); line-height: 1.7; margin: 0; }
  .related-martyrs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .related-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 6px 12px;
    border: 1px solid var(--border-2); border-radius: 2px; color: var(--text-dim);
    cursor: pointer; transition: all 0.2s; background: transparent;
  }
  .related-chip:hover { border-color: var(--martyr); color: var(--martyr); background: rgba(217,70,61,0.05); }

  .timeline-wrap { margin: 64px 0 40px; position: relative; overflow-x: auto; overflow-y: hidden; padding-bottom: 20px; scrollbar-width: thin; scrollbar-color: var(--martyr) var(--surface); }
  .timeline-wrap::-webkit-scrollbar { height: 6px; }
  .timeline-wrap::-webkit-scrollbar-track { background: var(--surface); border-radius: 3px; }
  .timeline-wrap::-webkit-scrollbar-thumb { background: var(--martyr); border-radius: 3px; }
  .timeline { display: flex; gap: 0; min-width: max-content; padding: 20px 0; position: relative; }
  .timeline::before {
    content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-2) 10%, var(--border-2) 90%, transparent);
    transform: translateY(-50%);
  }
  .tl-item { width: 220px; flex-shrink: 0; position: relative; padding: 0 12px; cursor: pointer; }
  .tl-item:nth-child(odd) { padding-top: 100px; }
  .tl-item:nth-child(even) { padding-bottom: 100px; }
  .tl-dot {
    position: absolute; left: 50%; width: 12px; height: 12px; background: var(--martyr);
    border: 2px solid var(--bg); border-radius: 50%; transform: translateX(-50%);
    box-shadow: 0 0 12px var(--martyr); transition: all 0.2s; z-index: 2;
  }
  .tl-item:nth-child(odd) .tl-dot { top: calc(100px - 6px); }
  .tl-item:nth-child(even) .tl-dot { bottom: calc(100px - 6px); }
  .tl-item:hover .tl-dot { transform: translateX(-50%) scale(1.4); box-shadow: 0 0 20px var(--martyr-2); }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 14px 14px 12px; transition: all 0.2s; }
  .tl-item:hover .tl-card { border-color: var(--martyr); background: var(--surface-2); }
  .tl-year { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--martyr); letter-spacing: 0.1em; margin-bottom: 6px; font-weight: 600; }
  .tl-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; line-height: 1.2; margin-bottom: 6px; color: var(--text); }
  .tl-event { font-size: 11px; color: var(--text-dim); line-height: 1.5; }

  .pattern-analyzer {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border-2); border-radius: 8px; padding: 40px;
    margin: 64px 0; position: relative; overflow: hidden;
  }
  .pattern-analyzer::before {
    content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(217,70,61,0.08), transparent 40%);
    animation: rotate 30s linear infinite; pointer-events: none;
  }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .pattern-analyzer h3 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 12px; position: relative; z-index: 1; }
  .pattern-analyzer .sub { font-size: 14px; color: var(--text-dim); margin-bottom: 28px; position: relative; z-index: 1; }
  .pattern-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; position: relative; z-index: 1; }
  .pattern-step { background: rgba(8,8,10,0.5); border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .pattern-step:hover { border-color: var(--martyr); background: rgba(217,70,61,0.05); transform: translateY(-2px); }
  .pattern-step.revealed { border-color: var(--martyr); background: rgba(217,70,61,0.08); }
  .pattern-step-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--martyr); letter-spacing: 0.1em; margin-bottom: 8px; }
  .pattern-step-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .pattern-step-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, margin 0.3s ease; }
  .pattern-step.revealed .pattern-step-desc { max-height: 200px; margin-top: 8px; }
  .pattern-step-hint { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 8px; }
  .pattern-step.revealed .pattern-step-hint { color: var(--martyr); }

  h2 {
    font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600;
    letter-spacing: -0.01em; margin: 80px 0 12px; padding-top: 40px;
    border-top: 1px solid var(--border); scroll-margin-top: 80px;
  }
  h2 .num { font-family: 'IBM Plex Mono', monospace; color: var(--martyr); font-size: 13px; margin-right: 16px; font-weight: 500; letter-spacing: 0.1em; }
  h3 { font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; margin: 36px 0 14px; color: var(--text); }
  p { margin-bottom: 16px; font-size: 16px; line-height: 1.75; }
  .lead {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--text);
    border-left: 3px solid var(--martyr); padding-left: 24px;
    margin: 32px 0 40px; line-height: 1.6; font-weight: 500;
  }
  .lead strong { color: var(--martyr-2); font-weight: 700; }

  .gap-box { background: var(--surface-2); border: 1px solid var(--martyr); border-left: 3px solid var(--martyr); border-radius: 4px; padding: 26px 28px; margin: 36px 0; }
  .gap-box h3 { margin-top: 0; color: var(--martyr); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; }
  .gap-box p { font-size: 15px; color: var(--text); }
  .gap-box p:last-child { margin-bottom: 0; }

  .callout {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--martyr);
    border: 1px dashed var(--martyr); border-radius: 4px; padding: 18px 22px;
    margin: 28px 0; text-align: center; letter-spacing: 0.04em;
    background: rgba(217,70,61,0.03); word-break: break-all;
  }
  .callout a { color: var(--martyr-2); text-decoration: none; border-bottom: 1px dotted var(--martyr-2); }
  .callout a:hover { color: var(--text); }

  .disclaimer { background: var(--surface-2); border: 1px solid var(--danger); border-radius: 4px; padding: 22px 26px; margin: 36px 0; font-size: 14px; color: var(--text-dim); line-height: 1.65; }
  .disclaimer strong { color: var(--danger-2); }

  .footer-note { margin-top: 100px; padding-top: 48px; border-top: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; }
  .footer-note strong { color: var(--martyr); font-weight: 600; }
  .footer-note a { color: var(--martyr); text-decoration: none; border-bottom: 1px dotted var(--martyr); }
