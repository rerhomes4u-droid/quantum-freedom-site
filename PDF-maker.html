<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Word to PDF · Doc Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }
        .card {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 45px -10px rgba(0, 20, 30, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            color: #0b2b3b;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0.35rem;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #2c5f73;
            background: rgba(44, 95, 115, 0.10);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .subhead {
            color: #1f4b5e;
            font-size: 1rem;
            font-weight: 400;
            border-left: 3px solid #3a8aa8;
            padding-left: 1rem;
            margin-bottom: 2rem;
            opacity: 0.85;
            background: rgba(58, 138, 168, 0.04);
            border-radius: 0 12px 12px 0;
            padding: 0.7rem 1.2rem;
        }
        .drop-zone {
            border: 2px dashed #b6d4e0;
            border-radius: 32px;
            padding: 2.5rem 1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            transition: 0.2s;
            margin: 1.2rem 0 1.8rem 0;
            cursor: pointer;
            position: relative;
        }
        .drop-zone:hover {
            border-color: #3a8aa8;
            background: rgba(58, 138, 168, 0.05);
        }
        .drop-zone.dragover {
            border-color: #0f6b8a;
            background: rgba(58, 138, 168, 0.12);
            box-shadow: 0 0 0 4px rgba(58, 138, 168, 0.15);
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .drop-icon {
            font-size: 3.8rem;
            line-height: 1;
            margin-bottom: 0.3rem;
            display: block;
            opacity: 0.7;
        }
        .drop-text {
            font-size: 1.15rem;
            font-weight: 500;
            color: #133e4f;
        }
        .drop-hint {
            color: #3b6d81;
            font-size: 0.9rem;
            margin-top: 6px;
        }
        .file-info {
            background: #eef5f9;
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #003349;
            margin: 0.5rem 0 0.2rem 0;
            border: 1px solid #c7dce7;
            word-break: break-all;
            max-width: 100%;
        }
        .file-info span {
            background: #1b5e79;
            color: white;
            border-radius: 40px;
            padding: 0.1rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            justify-content: space-between;
            align-items: center;
            margin: 1.8rem 0 0.8rem 0;
        }
        .btn {
            border: none;
            background: #d3e3ed;
            padding: 0.85rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #154c62;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.04);
            flex: 1 1 auto;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .btn-primary {
            background: #1b6f8f;
            color: white;
            box-shadow: 0 8px 18px -6px rgba(23, 90, 116, 0.3);
            border: 1px solid #2f8aad;
        }
        .btn-primary:hover {
            background: #135c79;
            transform: scale(1.02);
            box-shadow: 0 10px 22px -8px #135c79a0;
        }
        .btn-primary:disabled {
            opacity: 0.45;
            pointer-events: none;
            transform: none;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b0cedd;
            color: #1d566d;
        }
        .btn-outline:hover {
            background: #e4f0f7;
            border-color: #5698b5;
        }
        .sister-link {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 50, 70, 0.12);
            display: flex;
            justify-content: center;
        }
        .sister-link a {
            color: #1b5f7a;
            text-decoration: none;
            font-weight: 500;
            background: #e9f2f8;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            transition: 0.15s;
            border: 1px solid #bdd6e4;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .sister-link a:hover {
            background: #d2e5f0;
            border-color: #3a8aa8;
            color: #053141;
            transform: scale(1.02);
        }
        .status-msg {
            min-height: 1.8rem;
            font-size: 0.95rem;
            color: #14556b;
            margin: 0.2rem 0 0.8rem 0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: rgba(58, 138, 168, 0.06);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .status-msg.error {
            color: #b13e3e;
            background: #ffebeb;
        }
        .status-msg.success {
            color: #1b6f3a;
            background: #e4f5ea;
        }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #487183;
            margin-top: 1.8rem;
            letter-spacing: 0.3px;
        }
        @media (max-width: 540px) {
            .card { padding: 1.8rem; }
            h1 { font-size: 1.8rem; }
            .action-row { flex-direction: column; align-items: stretch; }
            .btn { padding: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <header style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;">
        <h1>
            📄→📑
            <small>Word to PDF</small>
        </h1>
    </header>
    <div class="subhead">
        ⚡ Open a .docx / .doc &nbsp;·&nbsp; print as PDF &nbsp;·&nbsp; save instantly
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <span class="drop-icon">📂</span>
        <div class="drop-text">Drop your Word file here</div>
        <div class="drop-hint">or click to browse · .docx / .doc</div>
        <div id="fileInfoContainer" style="margin-top: 14px;"></div>
    </div>

    <!-- Status -->
    <div id="statusMessage" class="status-msg">⏳ ready — select a document</div>

    <!-- Action buttons -->
    <div class="action-row">
        <button class="btn btn-outline" id="clearBtn" title="Clear file">✕ clear</button>
        <button class="btn btn-primary" id="convertBtn" disabled>🖨️ convert &amp; save PDF</button>
    </div>

    <!-- Sister app link (exactly as requested) -->
    <div class="sister-link">
        <a href="https://quantum-freedom-site.vercel.app/FREE-TEXT-READER.html" target="_blank" rel="noopener noreferrer">
            📖 sister app · FREE TEXT READER
        </a>
    </div>
    <div class="footer-note">
        ⚙️ all processing in your browser — nothing uploaded
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM refs
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileInfoContainer = document.getElementById('fileInfoContainer');
        const statusMsg = document.getElementById('statusMessage');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');

        let selectedFile = null;           // store File object

        // ---------- helpers ----------
        function setStatus(text, type = 'info') {
            statusMsg.textContent = text;
            statusMsg.className = 'status-msg';
            if (type === 'error') statusMsg.classList.add('error');
            else if (type === 'success') statusMsg.classList.add('success');
        }

        function renderFileInfo(file) {
            if (!file) {
                fileInfoContainer.innerHTML = '';
                return;
            }
            const sizeKB = (file.size / 1024).toFixed(1);
            const sizeMB = (file.size / (1024*1024)).toFixed(2);
            const sizeStr = file.size > 1024*1024 ? `${sizeMB} MB` : `${sizeKB} KB`;
            fileInfoContainer.innerHTML = `
                <div class="file-info">
                    📎 ${file.name} <span>${sizeStr}</span>
                </div>
            `;
        }

        function resetFileInput() {
            fileInput.value = '';          // allows re-selecting same file
            selectedFile = null;
            renderFileInfo(null);
            convertBtn.disabled = true;
            setStatus('⏳ ready — select a document', 'info');
        }

        function handleFile(file) {
            if (!file) {
                resetFileInput();
                return;
            }

            // Validate type (basic)
            const name = file.name.toLowerCase();
            const validExt = name.endsWith('.docx') || name.endsWith('.doc');
            const mimeType = file.type;
            const isWordMime = mimeType === 'application/msword' || 
                               mimeType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

            if (!validExt && !isWordMime) {
                setStatus('⚠️  Please select a Word document (.docx or .doc)', 'error');
                resetFileInput();
                return;
            }

            // additional sanity: if extension is weird but mime is fine, accept
            if (!validExt && isWordMime) {
                // accept anyway, but warn
                setStatus('📄 detected Word document (MIME)', 'info');
            }

            selectedFile = file;
            renderFileInfo(file);
            convertBtn.disabled = false;
            setStatus(`✅ ready: "${file.name}" — click convert`, 'success');
        }

        // ---------- event listeners ----------
        // 1. file input change
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                handleFile(this.files[0]);
            } else {
                resetFileInput();
            }
        });

        // 2. drag & drop
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                // if multiple, just take first
                const file = files[0];
                // manually set file input for consistency
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
                handleFile(file);
            } else {
                resetFileInput();
            }
        });

        // 3. clear button
        clearBtn.addEventListener('click', function() {
            resetFileInput();
            // also clear the file input
            fileInput.value = '';
            setStatus('🗑️  cleared', 'info');
        });

        // 4. CONVERT button — core functionality
        convertBtn.addEventListener('click', function() {
            if (!selectedFile) {
                setStatus('⚠️  No file selected', 'error');
                return;
            }

            // Build a Blob URL for the selected file
            const fileURL = URL.createObjectURL(selectedFile);

            // We'll create an iframe to load the Word document using the browser's built-in viewer.
            // Then we trigger print() -> "Save as PDF" 
            // This is the most reliable cross-browser way to "print as PDF" from a Word doc.
            // We'll embed the iframe in a temporary container, print it, then clean up.

            setStatus('⏳ opening document…', 'info');
            convertBtn.disabled = true;

            // Create a hidden iframe
            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.top = '-9999px';
            iframe.style.left = '-9999px';
            iframe.style.width = '90%';
            iframe.style.height = '90%';
            iframe.style.background = 'white';
            iframe.style.border = 'none';
            iframe.style.zIndex = '9999';
            // important: allow print
            iframe.setAttribute('allow', 'fullscreen');

            // We need to handle both .doc and .docx: 
            // For .docx, modern browsers can render if we set the src to the blob URL.
            // For .doc, some browsers may download instead of render. 
            // We'll try to force rendering by using an object/embed fallback, but the simplest
            // cross-browser approach: use <iframe src="blob:..."> and rely on browser's built-in viewer.
            // If the browser can't render, we'll show a fallback message.
            
            // Append iframe to body, load blob
            document.body.appendChild(iframe);

            // load handler
            iframe.onload = function() {
                // Give it a moment to render, then trigger print
                setTimeout(() => {
                    try {
                        // Focus the iframe and print
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                        // After print dialog closes, we clean up
                        // However, we can't detect when print dialog is dismissed reliably.
                        // we'll clean up after a delay, but keep iframe alive for a while.
                        setTimeout(() => {
                            // remove iframe after print attempt
                            if (iframe.parentNode) {
                                iframe.parentNode.removeChild(iframe);
                            }
                            URL.revokeObjectURL(fileURL);
                            convertBtn.disabled = false;
                            setStatus('✅ PDF dialog closed — save as PDF', 'success');
                        }, 3000);
                    } catch (err) {
                        // If print fails, fallback
                        console.warn('Print fallback:', err);
                        if (iframe.parentNode) {
                            iframe.parentNode.removeChild(iframe);
                        }
                        URL.revokeObjectURL(fileURL);
                        convertBtn.disabled = false;
                        setStatus('⚠️  Could not print. Try opening the file manually and print to PDF.', 'error');
                    }
                }, 600);
            };

            // error handler
            iframe.onerror = function() {
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
                URL.revokeObjectURL(fileURL);
                convertBtn.disabled = false;
                setStatus('❌ Failed to load document. Ensure it is a valid Word file.', 'error');
            };

            // Set src to blob URL
            try {
                iframe.src = fileURL;
            } catch (e) {
                // fallback
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
                URL.revokeObjectURL(fileURL);
                convertBtn.disabled = false;
                setStatus('⚠️  Browser error opening file. Try using "Open with" → Word then print to PDF.', 'error');
            }

            // extra safety: if iframe doesn't fire load within 10s, clean up
            setTimeout(() => {
                if (iframe.parentNode) {
                    // only if still attached
                    if (iframe.parentNode) {
                        iframe.parentNode.removeChild(iframe);
                    }
                    URL.revokeObjectURL(fileURL);
                    convertBtn.disabled = false;
                    setStatus('⌛ Timeout — please print manually if the document opened.', 'info');
                }
            }, 12000);
        });

        // On page load, set default state
        resetFileInput();

        // Handle potential case where file is dropped but input change doesn't fire
        // already handled via drop event.

        // Additional: if user clicks on drop zone but file input is hidden, it works
        // Also, we want the file input to be triggered by clicking the drop zone
        // The input is inside the drop-zone and covers it, so it works natively.

        console.log('📄 Word-to-PDF app ready · sister link included.');
    })();
</script>
</body>
</html>
