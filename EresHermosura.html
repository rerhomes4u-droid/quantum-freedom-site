<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Eres Belleza · You Are Beauty</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #fae9e0 0%, #f5d6c8 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s ease;
    }

    .app-container {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 250, 245, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 52px;
      padding: 36px 32px 44px;
      box-shadow: 0 30px 50px rgba(140, 80, 60, 0.15), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 4px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 240, 235, 0.7);
      transition: all 0.3s ease;
    }

    .lang-toggle {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 24px;
    }

    .lang-btn {
      background: transparent;
      border: 1.5px solid #c99b8b;
      color: #6b3e2e;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .lang-btn.active {
      background: #9e5e4b;
      border-color: #9e5e4b;
      color: white;
      box-shadow: 0 4px 12px rgba(158, 94, 75, 0.3);
    }

    .lang-btn:hover {
      background: #b47d6b;
      border-color: #b47d6b;
      color: white;
    }

    .lang-btn.active:hover {
      background: #8a4e3c;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #3d241b;
      margin-bottom: 8px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-family: 'Georgia', 'Times New Roman', serif;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .subhead {
      font-size: 1.1rem;
      color: #7b5b4e;
      font-weight: 400;
      margin-bottom: 28px;
      font-style: italic;
      border-left: 4px solid #dbb3a3;
      padding-left: 20px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255, 245, 240, 0.7);
      border-radius: 32px;
      padding: 28px 24px;
      margin-bottom: 26px;
      border: 1px solid rgba(230, 195, 180, 0.7);
      box-shadow: 0 8px 20px rgba(120, 70, 50, 0.05);
      transition: all 0.25s ease;
    }

    .card p {
      font-size: 1.15rem;
      color: #3e2a22;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .highlight {
      background: linear-gradient(120deg, #ffddd0 0%, #ffddd0 40%, #fce7de 90%);
      padding: 3px 10px;
      border-radius: 30px;
      font-weight: 600;
      color: #6b2e1b;
    }

    .big-quote {
      font-size: 1.6rem;
      font-family: 'Georgia', serif;
      line-height: 1.4;
      color: #4b2c20;
      text-align: center;
      padding: 12px 0 8px;
      font-weight: 500;
      letter-spacing: -0.01em;
      border-top: 2px dashed #d9b8a8;
      border-bottom: 2px dashed #d9b8a8;
      margin: 18px 0 14px;
    }

    .big-quote span {
      background: #ffd9cc;
      padding: 2px 12px;
      border-radius: 40px;
      display: inline-block;
    }

    .action-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 24px 0 10px;
      justify-content: center;
    }

    .action-btn {
      background: white;
      border: none;
      padding: 16px 26px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: #4d2e21;
      box-shadow: 0 6px 14px rgba(160, 100, 80, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(210, 160, 140, 0.5);
      flex: 1 0 auto;
      justify-content: center;
    }

    .action-btn:hover {
      background: #fff3ed;
      box-shadow: 0 10px 20px rgba(160, 100, 80, 0.2);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(160, 100, 80, 0.15);
    }

    .action-btn .emoji-big {
      font-size: 1.5rem;
      line-height: 1;
    }

    .affirmation-box {
      background: #5e3a2c;
      color: #ffefe8;
      border-radius: 28px;
      padding: 24px 28px;
      margin: 22px 0 12px;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.6;
      text-align: center;
      box-shadow: 0 12px 25px rgba(80, 40, 25, 0.2);
      border: 1px solid #b98b7a;
      transition: all 0.3s;
    }

    .affirmation-box strong {
      font-weight: 700;
      color: #ffe3d6;
      font-size: 1.35rem;
    }

    .counter-badge {
      display: inline-block;
      background: #c5765b;
      color: white;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .footer-note {
      text-align: center;
      font-size: 0.9rem;
      color: #a17b6c;
      margin-top: 28px;
      font-style: italic;
      border-top: 1px solid #e6cfc4;
      padding-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .floating-heart {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 999;
      animation: floatUp 1.8s ease-out forwards;
      opacity: 0.9;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
      100% { transform: translateY(-140px) scale(0.7); opacity: 0; }
    }

    @media (max-width: 550px) {
      .app-container { padding: 28px 20px 34px; border-radius: 38px; }
      h1 { font-size: 1.8rem; }
      .big-quote { font-size: 1.3rem; }
      .action-btn { padding: 14px 18px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="es" id="btnEs">Español</button>
      <button class="lang-btn" data-lang="en" id="btnEn">English</button>
    </div>

    <!-- dynamic content -->
    <div id="contentArea">
      <!-- injected via JS -->
    </div>
  </div>

  <script>
    (function(){
      // ----- TRANSLATIONS -----
      const translations = {
        es: {
          title: "Eres belleza pura",
          subhead: "Lo que describiste es la forma, textura y creación más hermosa del planeta. Tan bella que puede detener el mundo entero.",
          card1: "Has dicho: <span class='highlight'>«más arrugada de lo que pensaba»</span>, <span class='highlight'>«diferente»</span>, <span class='highlight'>«no es tan fea»</span>… Pero cada pliegue, cada línea, cada matiz es <strong>único, real y poderoso</strong>.",
          card2: "La «vagina perfecta» del porno no existe. Lo que existe es <strong>tu cuerpo</strong>, que ha vivido, sentido, dado vida, y guarda una historia que merece ser amada. Esa es la verdadera belleza.",
          quote: "«Tu vulva es más hermosa de lo que crees»",
          quoteSub: "Y lo que describes es <strong>el paisaje más bonito</strong> que alguien pueda imaginar.",
          affirmation: "Eres arte, eres fuerza, eres hogar. <br> <strong>No hay nada que corregir, solo amar.</strong>",
          actionTitle: "Toca para recordarlo",
          btnSelfLove: "🌸 Me amo tal como soy",
          btnStopWorld: "🌍 Detengo el mundo",
          btnMirror: "🪞 Espejo de gratitud",
          footer: "Hecho con amor para ti · Basado en la belleza real",
          hearts: ["💖", "🌺", "✨", "🌸", "🦋", "💗", "🌼", "💫"],
          mirrorText: "Eres hermosa, valiente y perfectamente real.",
          worldStopped: "¡El mundo se ha detenido por tu belleza!",
          selfLoveMsg: "¡Así se habla! Eres digna de todo amor.",
          gratitudMsg: "Gracias por existir, por ser tú.",
          clickCount: "veces que has detenido el mundo",
          counterTitle: "Has detenido el mundo",
          badgeTitle: "veces"
        },
        en: {
          title: "You are pure beauty",
          subhead: "What you described is the most beautiful shape, texture and creation on the planet. So beautiful it can stop the entire world in its tracks.",
          card1: "You said: <span class='highlight'>“more wrinkled than I thought”</span>, <span class='highlight'>“different”</span>, <span class='highlight'>“not as ugly”</span>… But every fold, every line, every shade is <strong>unique, real, and powerful</strong>.",
          card2: "The “perfect vagina” from porn doesn't exist. What exists is <strong>your body</strong>, which has lived, felt, given life, and holds a story that deserves to be loved. That is true beauty.",
          quote: "“Your vulva is more beautiful than you think”",
          quoteSub: "And what you describe is <strong>the most beautiful landscape</strong> anyone could imagine.",
          affirmation: "You are art, you are strength, you are home. <br> <strong>There is nothing to fix, only to love.</strong>",
          actionTitle: "Tap to remember",
          btnSelfLove: "🌸 I love myself as I am",
          btnStopWorld: "🌍 I stop the world",
          btnMirror: "🪞 Mirror of gratitude",
          footer: "Made with love for you · Based on real beauty",
          hearts: ["💖", "🌺", "✨", "🌸", "🦋", "💗", "🌼", "💫"],
          mirrorText: "You are beautiful, brave, and perfectly real.",
          worldStopped: "The world has stopped for your beauty!",
          selfLoveMsg: "That's right! You are worthy of all love.",
          gratitudMsg: "Thank you for existing, for being you.",
          clickCount: "times you've stopped the world",
          counterTitle: "You've stopped the world",
          badgeTitle: "times"
        }
      };

      // state
      let currentLang = 'es';
      let worldStopCount = 0;
      let stopCounterElement = null;

      // DOM elements
      const contentArea = document.getElementById('contentArea');
      const btnEs = document.getElementById('btnEs');
      const btnEn = document.getElementById('btnEn');

      // helper: create floating heart
      function spawnHeart(emoji = '💖') {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = emoji;
        heart.style.left = Math.random() * 80 + 10 + '%';
        heart.style.bottom = '20px';
        heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
        heart.style.position = 'fixed';
        heart.style.zIndex = '9999';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2000);
      }

      // main render function
      function render(lang) {
        currentLang = lang;
        const t = translations[lang];

        // update active button
        btnEs.classList.toggle('active', lang === 'es');
        btnEn.classList.toggle('active', lang === 'en');

        // build HTML
        contentArea.innerHTML = `
          <h1>${t.title} <span style="font-size:2.2rem;">✨</span></h1>
          <div class="subhead">${t.subhead}</div>

          <div class="card">
            <p>${t.card1}</p>
            <p>${t.card2}</p>
          </div>

          <div class="big-quote">
            <span>${t.quote}</span>
          </div>
          <p style="text-align:center; color:#7a5a4a; font-size:1.1rem; margin-bottom:20px;">${t.quoteSub}</p>

          <div class="affirmation-box" id="affirmationBox">
            ${t.affirmation}
          </div>

          <div style="text-align:center; margin: 18px 0 6px; font-weight: 600; color:#6b4a3c; letter-spacing:0.3px;">${t.actionTitle}</div>

          <div class="action-grid">
            <button class="action-btn" id="btnSelfLove"><span class="emoji-big">🌸</span> ${t.btnSelfLove}</button>
            <button class="action-btn" id="btnStopWorld"><span class="emoji-big">🌍</span> ${t.btnStopWorld}</button>
            <button class="action-btn" id="btnMirror"><span class="emoji-big">🪞</span> ${t.btnMirror}</button>
          </div>

          <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin:18px 0 8px; flex-wrap:wrap;">
            <span class="counter-badge" id="worldCounter">0 ${t.clickCount}</span>
          </div>

          <div class="footer-note">
            ${t.footer}
          </div>
        `;

        // set counter display
        stopCounterElement = document.getElementById('worldCounter');
        if (stopCounterElement) {
          stopCounterElement.textContent = `${worldStopCount} ${t.clickCount}`;
        }

        // attach events
        document.getElementById('btnSelfLove').addEventListener('click', () => {
          const hearts = t.hearts;
          for (let i = 0; i < 6; i++) {
            setTimeout(() => spawnHeart(hearts[Math.floor(Math.random() * hearts.length)]), i * 100);
          }
          const box = document.getElementById('affirmationBox');
          if (box) {
            box.style.transform = 'scale(1.02)';
            setTimeout(() => box.style.transform = 'scale(1)', 200);
          }
          alert(t.selfLoveMsg);
        });

        document.getElementById('btnStopWorld').addEventListener('click', () => {
          worldStopCount++;
          const t = translations[currentLang];
          if (stopCounterElement) {
            stopCounterElement.textContent = `${worldStopCount} ${t.clickCount}`;
          }
          // spawn many hearts
          const hearts = t.hearts;
          for (let i = 0; i < 12; i++) {
            setTimeout(() => spawnHeart(hearts[Math.floor(Math.random() * hearts.length)]), i * 70);
          }
          // animate world stop
          document.body.style.transition = 'background 0.2s';
          document.body.style.background = 'linear-gradient(145deg, #fce3d8, #eccbbd)';
          setTimeout(() => {
            document.body.style.background = 'linear-gradient(145deg, #fae9e0 0%, #f5d6c8 100%)';
          }, 300);
          alert(t.worldStopped);
        });

        document.getElementById('btnMirror').addEventListener('click', () => {
          const t = translations[currentLang];
          // show mirror message with hearts
          const hearts = t.hearts;
          for (let i = 0; i < 5; i++) {
            setTimeout(() => spawnHeart(hearts[Math.floor(Math.random() * hearts.length)]), i * 120);
          }
          alert(t.mirrorText + ' ' + t.gratitudMsg);
        });
      }

      // event listeners for language buttons
      btnEs.addEventListener('click', () => render('es'));
      btnEn.addEventListener('click', () => render('en'));

      // initial render (spanish)
      render('es');

      // extra: simulate floating hearts on load
      window.addEventListener('load', () => {
        const t = translations[currentLang];
        for (let i = 0; i < 4; i++) {
          setTimeout(() => spawnHeart(t.hearts[i % t.hearts.length]), i * 400);
        }
      });
    })();
  </script>
</body>
</html>
